# Suite E2E CLI de `dibu`: >= 5 Tier 1 + >= 5 Tier 2 por cada uno de los 4 subcomandos (40 casos).

# ---------------------------------------------------------------------------
# 1. list-types (5 Tier 1 + 5 Tier 2)
# ---------------------------------------------------------------------------
- id: cli_list_types_exit_zero
  feature: cli:list-types
  tier: 1
  description: "`dibu list-types` termina con rc=0, stderr vacío y al menos 1 tipo"
  subcommand: list-types
  action: list_types_basic

- id: cli_list_types_sorted_unique
  feature: cli:list-types
  tier: 1
  description: 'La salida de `list-types` está ordenada lexicográficamente, sin duplicados ni líneas vacías'
  subcommand: list-types
  action: list_types_sorted_unique

- id: cli_list_types_contains_control_9
  feature: cli:list-types
  tier: 1
  description: "`list-types` incluye los 9 tipos base de control de procesos"
  subcommand: list-types
  action: list_types_contains_control_9

- id: cli_list_types_contains_all_44
  feature: cli:list-types
  tier: 1
  description: "`list-types` expone exactamente los 44 tipos del catálogo completo"
  subcommand: list-types
  action: list_types_contains_all_44
  requires_all_44: true

- id: cli_list_types_help
  feature: cli:list-types
  tier: 1
  description: "`dibu list-types --help` termina con rc=0 y muestra la ayuda del subcomando"
  subcommand: list-types
  action: list_types_help

- id: cli_list_types_extra_arg_rejected
  feature: cli:list-types
  tier: 2
  description: "`dibu list-types foo` rechaza argumentos posicionales inesperados con rc=2"
  subcommand: list-types
  action: list_types_extra_arg

- id: cli_list_types_unknown_flag_rejected
  feature: cli:list-types
  tier: 2
  description: "`dibu list-types --color` rechaza flags no válidos con rc=2"
  subcommand: list-types
  action: list_types_unknown_flag

- id: cli_list_types_determinism
  feature: cli:list-types
  tier: 2
  description: 'Dos invocaciones seguidas de `list-types` producen bytes idénticos'
  subcommand: list-types
  action: list_types_determinism

- id: cli_list_types_ignores_stdin
  feature: cli:list-types
  tier: 2
  description: "`list-types` ignora basura en stdin y mantiene rc=0 y misma salida"
  subcommand: list-types
  action: list_types_ignores_stdin

- id: cli_list_types_root_no_args_error
  feature: cli:list-types
  tier: 2
  description: 'Invocar `dibu` sin subcomando ni flags falla con rc=2 y Usage'
  subcommand: list-types
  action: root_no_args


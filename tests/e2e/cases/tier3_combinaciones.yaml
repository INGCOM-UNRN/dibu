# Suite E2E Tier 3: Combinaciones Pairwise Cross-Feature (50 casos declarativos, tier: 3).
# Cubre los 44 tipos de diagramas (9 control + 21 chem + 14 cs) combinados por pares entre:
#   - Dominio / tipo de diagrama
#   - Paleta CLI (`tinta: true` vs `tinta: false`) y override `inkSaver` (`true`/`false`)
#   - Flags de visibilidad / docentes (`blank*`, `show*`, `margins`, `asymptotes`, etc.) y UTF-8
# + 5 casos de composición CLI cross-feature en `suites/test_tier3.py` (= 55 casos Tier 3).

# ===========================================================================
# A. Control (9 tipos + 2 combinaciones extra = 11 casos)
# ===========================================================================
- id: tier3_control_block_diagram_color_inksaver_blank
  feature: block_diagram
  tier: 3
  description: 'Pairwise: block_diagram + tinta:false + inkSaver:true + blank + blankSigns + UTF-8'
  tinta: false
  block:
    type: block_diagram
    title: "Lazo térmico — ñ/á"
    inkSaver: true
    forward: [{blank: true}, {label: "Gp(s)", out: "Y(s)"}]
    feedback: [{blank: true}]
    blankSigns: true
  expect:
    ok: true
    min_width: 180
    min_height: 80
    text_contains: ["Lazo térmico — ñ/á", "Gp(s)", "Y(s)"]
    text_absent: ["−", "+"]
    svg_contains: ['stroke-dasharray="3 2"', 'stroke-dasharray="2 2"']
    svg_absent: ["#1d4ed8", "#0f172a"]


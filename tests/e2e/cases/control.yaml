# Suite E2E Control de Procesos: 9 tipos × (>=5 Tier 1 + >=5 Tier 2) = 90 casos.
# Derivado de `fixtures/diagramas_control.yaml` y `alucarD/tests/test_diagramas_control.py`.

# ===========================================================================
# 1. block_diagram (5 Tier 1 + 5 Tier 2)
# ===========================================================================
- id: bd_t1_lazo_abierto
  feature: block_diagram
  tier: 1
  description: 'Lazo abierto simple con dos bloques en serie'
  tinta: true
  block:
    type: block_diagram
    forward: ["G1(s)", "G2(s)"]
  expect:
    ok: true
    min_width: 150
    min_height: 60
    text_contains: ["R(s)", "G1(s)", "G2(s)", "Y(s)"]
    text_absent: ["−"]

- id: bd_t1_realim_unitaria_color
  feature: block_diagram
  tier: 1
  description: 'Realimentación unitaria en modo color'
  tinta: false
  block:
    type: block_diagram
    forward: ["Gp(s)"]
    feedback: []
  expect:
    ok: true
    min_width: 150
    min_height: 80
    text_contains: ["R(s)", "Gp(s)", "Y(s)", "−", "+"]
    svg_contains: ["#1d4ed8"]

- id: bd_t1_completo_con_perturbacion
  feature: block_diagram
  tier: 1
  description: 'Fixture `bloques` completo con forward, perturbación, feedback y señales intermedias'
  tinta: false
  block:
    type: block_diagram
    title: Lazo de control de temperatura
    input: "R(s)"
    output: "Y(s)"
    error: "E(s)"
    forward:
      - {label: "Gc(s)", out: "U(s)"}
      - {label: "Gv(s)", out: "M(s)"}
      - "Gp(s)"
    disturbance: {at: 2, label: "D(s)", block: "Gd(s)"}
    feedback: ["H(s)"]
    measured: "B(s)"
  expect:
    ok: true
    min_width: 300
    min_height: 150
    text_contains: ["Lazo de control de temperatura", "R(s)", "E(s)", "U(s)", "M(s)", "D(s)", "Gd(s)", "H(s)", "B(s)", "Y(s)"]

- id: bd_t1_cascada_anidada
  feature: block_diagram
  tier: 1
  description: 'Fixture `cascada` con lazo interno anidado (`loop`)'
  tinta: true
  block:
    type: block_diagram
    title: Control en cascada
    forward:
      - "Gc1(s)"
      - loop:
          forward: ["Gc2(s)", "Gp2(s)"]
          feedback: ["H2(s)"]
      - "Gp1(s)"
    feedback: ["H1(s)"]
  expect:
    ok: true
    min_width: 300
    min_height: 150
    text_contains: ["Control en cascada", "Gc1(s)", "Gc2(s)", "Gp2(s)", "H2(s)", "Gp1(s)", "H1(s)"]

- id: bd_t1_blank_y_signo_pos
  feature: block_diagram
  tier: 1
  description: 'Bloques `blank` y signos en blanco (`blankSigns`) con realimentación positiva'
  tinta: true
  block:
    type: block_diagram
    forward: [{blank: true}, {label: "Gp", out: "Y"}]
    feedback: [{blank: true}]
    sign: "+"
    blankSigns: true
  expect:
    ok: true
    min_width: 150
    min_height: 80
    text_contains: ["Gp", "Y"]
    text_absent: ["−", "+"]
    svg_contains: ["stroke-dasharray=\"3 2\"", "stroke-dasharray=\"2 2\""]

- id: bd_t2_perturbacion_en_extremo
  feature: block_diagram
  tier: 2
  description: 'Perturbación en límite inferior `at: 0` con signo negativo'
  tinta: true
  block:
    type: block_diagram
    forward: ["G"]
    disturbance: {at: 0, sign: "-"}
  expect:
    ok: true
    min_width: 120
    min_height: 80
    text_contains: ["D(s)", "G", "−"]

- id: bd_t2_err_forward_vacio
  feature: block_diagram
  tier: 2
  description: 'Error al pasar `forward` vacío'
  block:
    type: block_diagram
    forward: []
  expect:
    ok: false
    error_contains: "forward: tiene que ser una lista de bloques"

- id: bd_t2_err_sign_invalido
  feature: block_diagram
  tier: 2
  description: 'Error al pasar `sign` distinto de `+` o `-`'
  block:
    type: block_diagram
    forward: ["G"]
    sign: "*"
  expect:
    ok: false
    error_contains: "sign: es '-' o '+'"

- id: bd_t2_err_bloque_vacio
  feature: block_diagram
  tier: 2
  description: 'Error cuando un bloque no tiene label ni `blank: true`'
  block:
    type: block_diagram
    forward: [""]
  expect:
    ok: false
    error_contains: "un bloque necesita label (o blank: true)"

- id: bd_t2_err_disturbance_oob
  feature: block_diagram
  tier: 2
  description: 'Error cuando `disturbance.at` excede la cantidad de bloques'
  block:
    type: block_diagram
    forward: ["G"]
    disturbance: {at: 2}
  expect:
    ok: false
    error_contains: "disturbance.at: va de 0 a 1"

# ===========================================================================
# 2. time_response (5 Tier 1 + 5 Tier 2)
# ===========================================================================
- id: tr_t1_segundo_orden_anotado
  feature: time_response
  tier: 1
  description: 'Fixture `respuesta2` de segundo orden subamortiguado con 5 anotaciones'
  tinta: false
  block:
    type: time_response
    title: Segundo orden subamortiguado
    system: {gain: 1, zeta: 0.3, wn: 2}
    annotations: [final, overshoot, peak, rise, settling]
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["y∞ = 1", "Mp = 37,2 %", "tp = 1,65", "tr =", "ts (2 %) ="]

- id: tr_t1_fopdt_tangente_blank
  feature: time_response
  tier: 1
  description: 'Fixture `fopdt` con tangente de Ziegler-Nichols y `blankAnnotations`'
  tinta: true
  block:
    type: time_response
    title: Curva de reacción (Ziegler-Nichols)
    system: {gain: 2, num: [2], den: [15, 8, 1], delay: 1}
    annotations: [final, tangent]
    blankAnnotations: true
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["y∞ =", "L =", "T =", "L+T"]

- id: tr_t1_multi_sistemas_leyenda
  feature: time_response
  tier: 1
  description: 'Fixture `zetas` comparando 3 sistemas con leyenda'
  tinta: true
  block:
    type: time_response
    title: Efecto de ζ
    systems:
      - {label: "ζ = 0,2", zeta: 0.2, wn: 1}
      - {label: "ζ = 0,5", zeta: 0.5, wn: 1}
      - {label: "ζ = 1", zeta: 1, wn: 1}
    tEnd: 20
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["ζ = 0,2", "ζ = 0,5", "ζ = 1"]
    svg_contains: ["7 3", "2 3"]

- id: tr_t1_lazo_pid_perturbacion
  feature: time_response
  tier: 1
  description: 'Fixture `pi` en lazo cerrado con controlador PI y perturbación'
  tinta: true
  block:
    type: time_response
    title: Lazo cerrado con PI y perturbación
    closedLoop:
      plant: {gain: 2, tau: 5, delay: 1}
      controller: {kp: 1.2, ki: 0.25}
    disturbance: {at: 30, amplitude: -0.5}
    tEnd: 60
    annotations: [overshoot, settling]
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["Mp =", "ts (2 %) ="]

- id: tr_t1_ramp_y_datos_medidos
  feature: time_response
  tier: 1
  description: 'Respuesta a rampa combinada con curva empírica `data`'
  tinta: false
  block:
    type: time_response
    systems: [{label: "Modelo", tau: 2}]
    input: ramp
    amplitude: 0.5
    tEnd: 6
    data: [[0, 0], [3, 0.8], [6, 2.1]]
    dataLabel: Exp
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["Modelo", "Exp", "t (s)", "y(t)"]

- id: tr_t2_ganancia_neg_y_delay_tau
  feature: time_response
  tier: 2
  description: 'Sistema de segundo orden con ganancia negativa y todas las anotaciones clave'
  tinta: true
  block:
    type: time_response
    system: {gain: -2, zeta: 0.3, wn: 2}
    annotations: [final, overshoot, peak, tau, delay]
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["y∞ = -2", "Mp = 37,2 %", "tp = 1,65"]

- id: tr_t2_integrador_e_inestable
  feature: time_response
  tier: 2
  description: 'Simulación conjunta de sistema integrador y sistema inestable (RHP) con `tEnd` acotado'
  tinta: true
  block:
    type: time_response
    systems:
      - {label: "Int", k: 1, poles: [0, -1]}
      - {label: "RHP", k: 1, poles: [0.5, -1]}
    tEnd: 4
    annotations: [final]
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["Int", "RHP"]

- id: tr_t2_err_sin_sistema
  feature: time_response
  tier: 2
  description: 'Error cuando falta `system`, `systems`, `closedLoop` y `data`'
  block:
    type: time_response
  expect:
    ok: false
    error_contains: "falta system, systems, closedLoop o data"

- id: tr_t2_err_impropio
  feature: time_response
  tier: 2
  description: 'Error al intentar simular un sistema impropio (más ceros que polos)'
  block:
    type: time_response
    system: {num: [1, 0, 0], den: [1, 1]}
  expect:
    ok: false
    error_contains: "el sistema es impropio"

- id: tr_t2_err_anotacion_desconocida
  feature: time_response
  tier: 2
  description: 'Error cuando `annotations` incluye un nombre inválido'
  block:
    type: time_response
    system: {tau: 1}
    annotations: ["magia"]
  expect:
    ok: false
    error_contains: "anotaciones desconocidas"

# ===========================================================================
# 3. bode (5 Tier 1 + 5 Tier 2)
# ===========================================================================
- id: bode_t1_both_asymptotes_margins
  feature: bode
  tier: 1
  description: 'Fixture `bode` completo con asíntotas y márgenes de fase/ganancia'
  tinta: false
  block:
    type: bode
    title: Bode de L(s) = 10 / (s(s+1)(s+10))
    system: {k: 10, poles: [0, -1, -10]}
    asymptotes: true
    margins: true
  expect:
    ok: true
    min_width: 300
    min_height: 250
    text_contains: ["|G(jω)| (dB)", "∠G(jω) (°)", "ω (rad/s)", "MG =", "ω180 =", "MF =", "ωc ="]

- id: bode_t1_solo_magnitud
  feature: bode
  tier: 1
  description: 'Panel único de magnitud (`show: magnitude`)'
  tinta: true
  block:
    type: bode
    system: {tau: 1}
    show: magnitude
  expect:
    ok: true
    min_width: 300
    min_height: 150
    text_contains: ["|G(jω)| (dB)", "ω (rad/s)"]
    text_absent: ["∠G(jω) (°)"]

- id: bode_t1_solo_fase
  feature: bode
  tier: 1
  description: 'Panel único de fase (`show: phase`)'
  tinta: true
  block:
    type: bode
    system: {tau: 1}
    show: phase
  expect:
    ok: true
    min_width: 300
    min_height: 150
    text_contains: ["∠G(jω) (°)", "ω (rad/s)"]
    text_absent: ["|G(jω)| (dB)"]

- id: bode_t1_closedLoop_blankMargins
  feature: bode
  tier: 1
  description: 'Bode de lazo abierto desde `closedLoop` con `blankMargins: true`'
  tinta: true
  block:
    type: bode
    closedLoop:
      plant: {k: 1, poles: [0, -1, -2]}
      controller: {kp: 1}
    margins: true
    blankMargins: true
  expect:
    ok: true
    min_width: 300
    min_height: 250
    text_contains: ["MG =", "MF ="]
    text_absent: ["15,6"]

- id: bode_t1_multi_sistemas_delay
  feature: bode
  tier: 1
  description: 'Múltiples sistemas en Bode incluyendo retardo puro y ganancia negativa'
  tinta: false
  block:
    type: bode
    systems:
      - {label: "Con retardo", gain: 1, tau: 1, delay: 0.5}
      - {label: "Negativo", gain: -2, tau: 2}
    wMin: 0.1
    wMax: 100
  expect:
    ok: true
    min_width: 300
    min_height: 250
    text_contains: ["Con retardo", "Negativo"]

- id: bode_t2_ganancia_pura_sin_quiebres
  feature: bode
  tier: 2
  description: 'Ganancia pura sin cruces de 0 dB ni -180° emite MG infinito y MF guion'
  tinta: true
  block:
    type: bode
    system: {num: [2], den: [1]}
    margins: true
  expect:
    ok: true
    min_width: 300
    min_height: 250
    text_contains: ["MG = ∞", "MF = —"]

- id: bode_t2_orden_alto_clip_fase
  feature: bode
  tier: 2
  description: 'Sistema de orden 9 recorta límite inferior de fase a -720°'
  tinta: true
  block:
    type: bode
    system: {k: 1, poles: [-1, -1, -1, -1, -1, -1, -1, -1, -1]}
  expect:
    ok: true
    min_width: 300
    min_height: 250
    text_contains: ["-720"]

- id: bode_t2_err_sin_sistema
  feature: bode
  tier: 2
  description: 'Error en `bode` sin `system`, `systems` ni `closedLoop`'
  block:
    type: bode
  expect:
    ok: false
    error_contains: "bode: falta system, systems o closedLoop"

- id: bode_t2_err_wmin_ge_wmax
  feature: bode
  tier: 2
  description: 'Error cuando `wMin >= wMax`'
  block:
    type: bode
    system: {tau: 1}
    wMin: 10
    wMax: 1
  expect:
    ok: false
    error_contains: "wMin y wMax son positivas y wMin < wMax"

- id: bode_t2_err_show_invalido
  feature: bode
  tier: 2
  description: 'Error cuando `show` tiene valor desconocido'
  block:
    type: bode
    system: {tau: 1}
    show: todo
  expect:
    ok: false
    error_contains: "bode: show es both, magnitude o phase"

# ===========================================================================
# 4. nyquist (5 Tier 1 + 5 Tier 2)
# ===========================================================================
- id: nyq_t1_basico_unitCircle
  feature: nyquist
  tier: 1
  description: 'Fixture `nyquist` con círculo unitario activado'
  tinta: false
  block:
    type: nyquist
    title: Nyquist
    system: {k: 5, poles: [-1, -2, -3]}
    unitCircle: true
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["Re", "Im", "−1"]

- id: nyq_t1_sin_negativas_y_limit
  feature: nyquist
  tier: 1
  description: 'Traza de Nyquist con `showNegative: false` y `limit` fijo'
  tinta: true
  block:
    type: nyquist
    system: {k: 2, poles: [-1, -2]}
    showNegative: false
    limit: 3.0
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["Re", "Im", "−1"]

- id: nyq_t1_closedLoop
  feature: nyquist
  tier: 1
  description: 'Nyquist evaluado desde `closedLoop`'
  tinta: true
  block:
    type: nyquist
    closedLoop:
      plant: {k: 2, poles: [-1, -2]}
      controller: {kp: 1.5}
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["−1"]

- id: nyq_t1_multi_sistemas
  feature: nyquist
  tier: 1
  description: 'Múltiples curvas de Nyquist con leyenda'
  tinta: false
  block:
    type: nyquist
    systems:
      - {label: "Estable", k: 1, poles: [-1, -2]}
      - {label: "Tipo 1", k: 5, poles: [0, -1, -2]}
  expect:
    ok: true
    min_width: 150
    min_height: 200
    text_contains: ["Estable", "Tipo 1", "−1"]

- id: nyq_t1_con_retardo
  feature: nyquist
  tier: 1
  description: 'Nyquist de sistema de primer orden con retardo y círculo unitario'
  tinta: true
  block:
    type: nyquist
    system: {gain: 1, tau: 1, delay: 0.8}
    unitCircle: true
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["−1"]

- id: nyq_t2_ganancia_pura
  feature: nyquist
  tier: 2
  description: 'Nyquist degenerado de ganancia pura (punto único en el eje real)'
  tinta: true
  block:
    type: nyquist
    system: {num: [2], den: [1]}
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["−1", "Re", "Im"]

- id: nyq_t2_polo_en_origen
  feature: nyquist
  tier: 2
  description: 'Nyquist de sistema tipo 1 con polo en el origen y rango acotado'
  tinta: true
  block:
    type: nyquist
    system: {k: 1, poles: [0, -1, -2]}
    wMin: 0.05
    wMax: 50
  expect:
    ok: true
    min_width: 120
    min_height: 200
    text_contains: ["−1"]

- id: nyq_t2_wmin_gt_wmax_resiliente
  feature: nyquist
  tier: 2
  description: 'Nyquist con `wMin > wMax` no produce panic y renderiza punto crítico'
  tinta: true
  block:
    type: nyquist
    system: {tau: 1}
    wMin: 10
    wMax: 1
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["−1"]

- id: nyq_t2_err_sin_sistema
  feature: nyquist
  tier: 2
  description: 'Error en `nyquist` sin sistema'
  block:
    type: nyquist
  expect:
    ok: false
    error_contains: "nyquist: falta system, systems o closedLoop"

- id: nyq_t2_err_sistema_invalido
  feature: nyquist
  tier: 2
  description: 'Error en `nyquist` por `tau` negativa'
  block:
    type: nyquist
    system: {tau: -1}
  expect:
    ok: false
    error_contains: "tau: tiene que ser positiva"

# ===========================================================================
# 5. pole_zero (5 Tier 1 + 5 Tier 2)
# ===========================================================================
- id: pz_t1_polos_ceros_grilla
  feature: pole_zero
  tier: 1
  description: 'Fixture `polos` con grilla de amortiguamiento/frecuencia y valores'
  tinta: false
  block:
    type: pole_zero
    title: Polos y ceros
    poles: [-1, [-2, 3]]
    zeros: [-4]
    dampingLines: [0.5]
    wnCircles: [3]
    showValues: true
  expect:
    ok: true
    min_width: 300
    min_height: 250
    text_contains: ["Polos y ceros", "ζ = 0,5", "ωn = 3", "-1", "-2 + j3", "-2 − j3", "-4"]

- id: pz_t1_desde_system
  feature: pole_zero
  tier: 1
  description: 'Mapa de polos y ceros extraído de `system`'
  tinta: true
  block:
    type: pole_zero
    system: {k: 2, poles: [-1, -3], zeros: [-2]}
    showValues: true
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["-1", "-3", "-2"]

- id: pz_t1_desde_closedLoop
  feature: pole_zero
  tier: 1
  description: 'Polos de lazo cerrado calculados desde `closedLoop`'
  tinta: true
  block:
    type: pole_zero
    closedLoop:
      plant: {k: 4, poles: [0, -2]}
      controller: {kp: 1}
    showValues: true
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["-1 + j1,73", "-1 − j1,73"]

- id: pz_t1_blank
  feature: pole_zero
  tier: 1
  description: 'Modo `blank: true` conserva grilla y omite marcas/valores de polos y ceros'
  tinta: true
  block:
    type: pole_zero
    poles: [-1, -2]
    zeros: [-3]

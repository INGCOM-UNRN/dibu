    showValues: true
    dampingLines: [0.707]
    wnCircles: [2]
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["ζ = 0,707", "ωn = 2"]
    svg_absent: ["<circle", "stroke-width=\"1.8\""]

- id: pz_t1_rangos_custom
  feature: pole_zero
  tier: 1
  description: 'Rangos explícitos `xRange` e `yRange` en plano s'
  tinta: false
  block:
    type: pole_zero
    poles: [-1, [-1, 2]]
    xRange: [-4, 2]
    yRange: [-3, 3]
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["σ (Re s)", "jω (Im s)"]

- id: pz_t2_vacio
  feature: pole_zero
  tier: 2
  description: 'Plano s vacío sin polos ni ceros renderiza ejes por defecto'
  tinta: true
  block:
    type: pole_zero
  expect:
    ok: true
    min_width: 250
    min_height: 200
    text_contains: ["σ (Re s)", "jω (Im s)"]

- id: pz_t2_origen_doble_y_rhp
  feature: pole_zero
  tier: 2
  description: 'Polos múltiples en el origen, semiplano derecho y rectas ζ límite 0 y 1'
  tinta: true
  block:
    type: pole_zero
    poles: [0, 0, 2]
    zeros: [0, -1]
    dampingLines: [0, 1]
    showValues: true
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["0", "2", "-1", "ζ = 0", "ζ = 1"]

- id: pz_t2_err_damping_gt1
  feature: pole_zero
  tier: 2
  description: 'Error si `dampingLines` supera 1'
  block:
    type: pole_zero
    poles: [-1]
    dampingLines: [1.2]
  expect:
    ok: false
    error_contains: "dampingLines: cada ζ va de 0 a 1"

- id: pz_t2_err_damping_neg
  feature: pole_zero
  tier: 2
  description: 'Error si `dampingLines` es negativo'
  block:
    type: pole_zero
    poles: [-1]
    dampingLines: [-0.1]
  expect:
    ok: false
    error_contains: "dampingLines: cada ζ va de 0 a 1"

- id: pz_t2_err_par_complejo_invalido
  feature: pole_zero
  tier: 2
  description: 'Error cuando un par complejo tiene 3 elementos'
  block:
    type: pole_zero
    poles: [[1, 2, 3]]
  expect:
    ok: false
    error_contains: "un par complejo es [real, imaginaria]"

# ===========================================================================
# 6. root_locus (5 Tier 1 + 5 Tier 2)
# ===========================================================================
- id: rl_t1_tercer_orden_cruce

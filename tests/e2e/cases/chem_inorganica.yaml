- id: chem_born_haber_t1_blank_lattice
  feature: born_haber
  tier: 1
  description: 'Fixture `born-haber-blanco`: `blankLattice: true` oculta el valor de U_red'
  tinta: true
  block:
    type: born_haber
    start: "K(s) + ½ Br2(l)"
    product: "KBr(s)"
    formation: -394
    steps:
      - {to: "K(g)", dH: 89, label: "ΔH_sub"}
      - {to: "K^+(g)", dH: 419, label: "EI"}
      - {to: "K^+(g) + Br(g)", dH: 112, label: "½ D + vap"}
      - {to: "K^+(g) + Br^-(g)", dH: -325, label: "AE"}
    blankLattice: true
  expect:
    ok: true
    min_width: 650
    min_height: 380
    text_contains: ["Ured =", "ΔHf = -394"]
    text_absent: ["-689"]
    svg_contains: ["stroke-dasharray=\"3 2\""]

- id: chem_born_haber_t2_steps_blank_con_y_sin_label
  feature: born_haber
  tier: 2
  description: 'Pasos con `blank: true` con y sin `label`'
  tinta: true
  block:
    type: born_haber
    formation: -100
    steps:
      - {to: "A", dH: 50, blank: true}
      - {to: "B", dH: -20, label: "AE", blank: true}
  expect:
    ok: true
    min_width: 450
    min_height: 380
    text_contains: ["=", "AE =", "Ured = -130 kJ/mol"]
    text_absent: ["+50", "-20"]
    svg_contains: ["stroke-dasharray=\"3 2\""]


  tier: 1
  description: 'Fixture `campo-tetraedrico`: Co(II) tetraédrico siempre alto espín en modo color'
  tinta: false
  block:
    type: crystal_field
    geometry: tetrahedral
    complex: "[CoCl4]^2-"
    metal: Co
    oxidation: 2
  expect:
    ok: true
    min_width: 430
    min_height: 320
    text_contains: ["[CoCl4]2−", "d7: e4 t23", "alto (Δt chico: siempre alto espín)", "3,87 μB", "−1,2 Δt"]
    svg_contains: ["#1d4ed8", "#0f172a"]

- id: chem_crystal_field_t1_square_planar
  feature: crystal_field
  tier: 1
  description: 'Fixture `campo-cuadrado-plano`: Ni(II) cuadrado plano sin fila EECC'
  tinta: true

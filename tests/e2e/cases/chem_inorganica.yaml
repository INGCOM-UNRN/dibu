# ===========================================================================
# 21. born_haber (5 Tier 1 + 6 Tier 2 = 11 casos)
# ===========================================================================
- id: chem_born_haber_t1_nacl_completo
  feature: born_haber
  tier: 1
  description: 'Fixture `born-haber-nacl`: ciclo completo del NaCl con energía de red calculada'
  tinta: true
  block:
    type: born_haber
    title: "Ciclo de Born-Haber del NaCl"
    start: "Na(s) + ½ Cl2(g)"
    product: "NaCl(s)"
    formation: -411
    steps:
      - {to: "Na(g) + ½ Cl2(g)", dH: 107, label: "ΔH_sub"}
      - {to: "Na^+(g) + ½ Cl2(g)", dH: 496, label: "EI"}
      - {to: "Na^+(g) + Cl(g)", dH: 122, label: "½ D"}
      - {to: "Na^+(g) + Cl^-(g)", dH: -349, label: "AE"}
  expect:
    ok: true
    min_width: 650
    min_height: 400
    text_contains: ["Ciclo de Born-Haber del NaCl", "Na(s) + ½ Cl2(g)", "ΔHsub +107", "AE -349", "Ured = -787 kJ/mol", "ΔHf = -411", "Energías en kJ/mol."]

- id: chem_born_haber_t1_defaults_minimo
  feature: born_haber
  tier: 1
  description: 'Defaults `start` ("elementos") y `product` ("MX(s)") con un único paso'
  tinta: true
  block:
    type: born_haber
    formation: -300
    steps:
      - {to: "M^+(g) + X^-(g)", dH: 400}
  expect:
    ok: true
    min_width: 350
    min_height: 380
    text_contains: ["elementos", "MX(s)", "+400", "Ured = -700 kJ/mol", "ΔHf = -300"]

- id: chem_born_haber_t1_mgo_exotermico_color
  feature: born_haber
  tier: 1
  description: 'Ciclo de MgO con energía de red alta (-3790) en paleta color'
  tinta: false
  block:
    type: born_haber
    start: "Mg(s) + ½ O2(g)"
    product: "MgO(s)"
    formation: -602
    steps:
      - {to: "Mg(g) + ½ O2(g)", dH: 148, label: "ΔH_sub"}
      - {to: "Mg^2+(g) + ½ O2(g)", dH: 2188, label: "EI1+EI2"}
      - {to: "Mg^2+(g) + O(g)", dH: 249, label: "½ D"}
      - {to: "Mg^2+(g) + O^2-(g)", dH: 603, label: "AE1+AE2"}
  expect:
    ok: true
    min_width: 650
    min_height: 380
    text_contains: ["Ured = -3790 kJ/mol", "ΔHf = -602"]
    svg_contains: ["#1d4ed8", "#0f172a"]


# Suite E2E Química Inorgánica: 5 tipos × (>=5 Tier 1 + >=5 Tier 2) = 56 casos.
# Tipos: crystal_field, complex, latimer, frost, born_haber.
# Derivado de `fixtures/diagramas_quimica.yaml`, `alucarD/tests/test_diagramas_quimica.py` y `spec_inorganica.md`.

# ===========================================================================
# 17. crystal_field (5 Tier 1 + 7 Tier 2 = 12 casos)
# ===========================================================================
- id: chem_crystal_field_t1_oct_low_ligand
  feature: crystal_field
  tier: 1
  description: 'Fixture `campo-co-nh3`: Co(III) octaédrico con NH3 (bajo espín por serie espectroquímica)'
  tinta: true
  block:
    type: crystal_field
    title: "[Co(NH3)6]^3+"
    metal: Co
    oxidation: 3
    ligand: NH3
  expect:
    ok: true
    min_width: 430
    min_height: 350
    text_contains: ["[Co(NH3)6]3+", "d6: t2g6 eg0", "bajo (NH3: campo fuerte)", "0,00 μB", "−2,4 Δo"]

- id: chem_crystal_field_t1_oct_high_h2o
  feature: crystal_field
  tier: 1
  description: 'Fixture `campo-fe-agua`: Fe(III) octaédrico con H2O (d5 alto espín, EECC 0,0)'
  tinta: true
  block:
    type: crystal_field
    complex: "[Fe(H2O)6]^3+"
    metal: Fe
    oxidation: 3
    ligand: H2O
  expect:
    ok: true
    min_width: 430
    min_height: 320
    text_contains: ["[Fe(H2O)6]3+", "d5: t2g3 eg2", "alto (H2O: campo débil)", "5,92 μB", "0,0 Δo"]

- id: chem_crystal_field_t1_tetrahedral_color

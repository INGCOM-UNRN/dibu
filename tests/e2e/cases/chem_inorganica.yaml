    min_height: 100
    text_contains: ["Fe3+", "Fe2+", "Fe", "Desproporcionan = ninguna"]
    svg_contains: ["#1d4ed8", "#0f172a"]

- id: chem_latimer_t1_ox_negativos_compute_invertido
  feature: latimer
  tier: 1
  description: 'Estados de oxidación negativos y arco `compute` con índices invertidos `[3, 0]`'

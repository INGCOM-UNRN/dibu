    oxidation: [0, -1, -2, -3]
    potentials: [-1.87, 1.41, 1.28]
    compute: [[3, 0]]
  expect:
    ok: true
    min_width: 320
    min_height: 120
    text_contains: ["-1", "-2", "-3", "E° = 0,27 V"]

- id: chem_latimer_t1_ox_fraccionario
  feature: latimer
  tier: 1
  description: 'Estado de oxidación fraccionario (`2.5` -> `2,5`) en pareja tiosulfato/tetrationato'
  tinta: true
  block:
    type: latimer
    species: ["S4O6^2-", "S2O3^2-"]
    oxidation: [2.5, 2]
    potentials: [0.08]
  expect:
    ok: true
    min_width: 150
    min_height: 70
    text_contains: ["S4O62−", "S2O32−", "2,5", "+2", "0,08"]

- id: chem_latimer_t2_blanks_totales
  feature: latimer
  tier: 2
  description: 'Fixture `latimer-cobre-blanco` ampliado con `blankPotentials`, `blankComputed` y `blankDisproportionation`'
  tinta: true
  block:
    type: latimer
    species: ["Cu^2+", "Cu^+", "Cu"]
    oxidation: [2, 1, 0]
    potentials: [0.16, 0.52]
    compute: [[0, 2]]
    blankPotentials: [0, 1]
    blankComputed: true
    showDisproportionation: true
    blankDisproportionation: true
  expect:
    ok: true
    min_width: 200
    min_height: 150
    text_contains: ["E° =", "Desproporcionan ="]
    text_absent: ["0,16", "0,52", "0,34", "Desproporcionan = Cu+"]
    svg_contains: ["stroke-dasharray=\"3 2\""]

- id: chem_latimer_t2_inksaver_override

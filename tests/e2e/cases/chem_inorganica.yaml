# 19. latimer (5 Tier 1 + 5 Tier 2 = 10 casos)
# ===========================================================================
- id: chem_latimer_t1_manganeso_completo
  feature: latimer
  tier: 1
  description: 'Fixture `latimer-manganeso`: cadena completa, arcos `compute` y desproporción'
  tinta: true
  block:
    type: latimer
    title: "Manganeso en medio ácido"
    species: ["MnO4^-", "MnO4^2-", "MnO2", "Mn^3+", "Mn^2+", "Mn"]
    oxidation: [7, 6, 4, 3, 2, 0]
    potentials: [0.56, 2.26, 0.95, 1.51, -1.18]
    compute: [[0, 2], [0, 4]]
    showDisproportionation: true
  expect:
    ok: true
    min_width: 500
    min_height: 200
    text_contains: ["Manganeso en medio ácido", "+7", "0,56", "-1,18", "E° = 1,69 V", "E° = 1,51 V", "Desproporcionan = MnO42−, Mn3+"]

- id: chem_latimer_t1_cobre_minimo
  feature: latimer
  tier: 1
  description: 'Cadena mínima de 3 especies con desproporción de Cu+'
  tinta: true
  block:
    type: latimer
    species: ["Cu^2+", "Cu^+", "Cu"]
    oxidation: [2, 1, 0]
    potentials: [0.16, 0.52]
    compute: [[0, 2]]
    showDisproportionation: true
  expect:
    ok: true
    min_width: 200
    min_height: 150
    text_contains: ["Cu2+", "Cu+", "Cu", "E° = 0,34 V", "Desproporcionan = Cu+"]

- id: chem_latimer_t1_sin_desproporcion_color

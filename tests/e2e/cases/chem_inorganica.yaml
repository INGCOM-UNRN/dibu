    min_width: 430
    min_height: 300
    text_contains: ["[Ni(CN)4]2−", "dxz, dyz", "dz²", "dxy", "dx²−y²", "d8", "bajo", "0,00 μB"]
    text_absent: ["EECC:"]

- id: chem_crystal_field_t1_electrons_directo
  feature: crystal_field
  tier: 1
  description: 'Especificación directa de `electrons: 4` y `spin: low`'
  tinta: true
  block:
    type: crystal_field
    electrons: 4
    spin: low
  expect:
    ok: true
    min_width: 430
    min_height: 320
    text_contains: ["d4: t2g4 eg0", "bajo", "2,83 μB", "−1,6 Δo"]

- id: chem_crystal_field_t2_d0_ti4
  feature: crystal_field
  tier: 2
  description: 'Caso borde d0 (Ti4+) sin electrones desapareados'
  tinta: true
  block:
    type: crystal_field
    metal: Ti
    oxidation: 4
    ligand: "Cl^-"
  expect:
    ok: true
    min_width: 430
    min_height: 320
    text_contains: ["d0: t2g0 eg0", "0,00 μB", "0,0 Δo"]

- id: chem_crystal_field_t2_lantano_inksaver
  feature: crystal_field
  tier: 2
  description: 'Rama especial `La` (Z=57) con override `inkSaver: true` sobre `tinta: false`'
  tinta: false
  block:
    type: crystal_field
    metal: La
    oxidation: 0
    inkSaver: true
  expect:
    ok: true
    min_width: 430
    min_height: 320
    text_contains: ["d3: t2g3 eg0", "3,87 μB", "−1,2 Δo"]
    svg_absent: ["#1d4ed8", "#0f172a"]

- id: chem_crystal_field_t2_blank_total
  feature: crystal_field
  tier: 2
  description: 'Fixture `campo-blanco`: oculta flechas de electrones y todas las filas del panel'
  tinta: true
  block:
    type: crystal_field
    metal: Fe
    oxidation: 2
    ligand: "CN^-"
    blankElectrons: true
    blank: true
  expect:
    ok: true
    min_width: 430
    min_height: 320
    text_contains: ["Configuración:", "Espín:", "Desapareados:", "μ (solo espín):", "EECC:"]
    text_absent: ["d6", "bajo", "0,00 μB", "−2,4 Δo"]
    svg_contains: ["stroke-dasharray=\"3 2\""]

- id: chem_crystal_field_t2_err_sin_electrones
  feature: crystal_field
  tier: 2
  description: 'Error controlado cuando faltan `electrons` y `metal`+`oxidation`'
  block:
    type: crystal_field
    geometry: octahedral
  expect:
    ok: false
    error_contains: "falta electrons"

- id: chem_crystal_field_t2_err_metal_no_d
  feature: crystal_field
  tier: 2
  description: 'Error controlado para metal fuera del bloque d (`Na`)'
  block:
    type: crystal_field
    metal: Na
    oxidation: 1
  expect:
    ok: false
    error_contains: "metal de transición del bloque d"

- id: chem_crystal_field_t2_err_ligando_desconocido
  feature: crystal_field
  tier: 2
  description: 'Error controlado para ligando ausente de la serie espectroquímica sin `spin`'
  block:
    type: crystal_field
    electrons: 5
    ligand: agua
  expect:
    ok: false
    error_contains: "serie espectroquímica"

- id: chem_crystal_field_t2_err_spin_invalido
  feature: crystal_field
  tier: 2
  description: 'Error controlado para `spin` inválido (`medium`)'
  block:
    type: crystal_field
    electrons: 5
    spin: medium
  expect:
    ok: false
    error_contains: "spin vale high o low"


# ===========================================================================
# 9. trace_table (5 Tier 1 + 7 Tier 2 = 12 casos)
# ===========================================================================
- id: cs_trace_table_t1_variables_columns_rows
  feature: trace_table
  tier: 1
  description: 'Tabla de traza de variables básica con columns y rows'
  tinta: true
  block:
    type: trace_table
    columns: ["i", "suma"]
    rows:
      - [0, 0]
      - [1, 5]
      - [2, 15]
  expect:
    ok: true
    min_width: 100
    min_height: 110
    text_contains: ["i", "suma", "5", "15"]

- id: cs_trace_table_t1_variables_operations_y_rowcount_color
  feature: trace_table
  tier: 1
  description: 'Tabla de traza con operaciones, operationHeader personalizado, fila parcial y rowCount en color'
  tinta: false
  block:
    type: trace_table
    columns: ["i", "s"]
    operations: ["s = 0", "i = 1", "s += i"]
    operationHeader: "Línea"
    rows:
      - [0, 0]
      - [1, null]
    rowCount: 4
  expect:
    ok: true
    min_width: 160
    min_height: 140
    text_contains: ["Línea", "i", "s", "s = 0", "s += i"]
    svg_contains: ["#1d4ed8", 'stroke-dasharray="3 2"']

- id: cs_trace_table_t1_variables_blank_values
  feature: trace_table
  tier: 1
  description: 'Tabla de traza con blankValues=true oculta los datos existentes'
  tinta: true
  block:
    type: trace_table
    columns: ["a", "b"]
    rows:
      - [10, 20]
      - [30, 40]
    blankValues: true
  expect:
    ok: true
    min_width: 100
    min_height: 90
    text_contains: ["a", "b"]
    text_absent: ["10", "20", "30", "40"]
    svg_contains: ['stroke-dasharray="3 2"']

- id: cs_trace_table_t1_statics_stack
  feature: trace_table
  tier: 1
  description: 'Traza modo statics para pila con capacity=5 y pointerLabel'
  tinta: true
  block:
    type: trace_table
    variant: stack
    capacity: 5
    pointerLabel: "TOPE: ___"
    operations: ["1. push(10)", "2. pop()"]
  expect:
    ok: true
    min_width: 450
    min_height: 110
    text_contains: ["Operación / Instrucción C", "[0]", "[4]", "Puntero TOPE", "1. push(10)", "2. pop()", "TOPE: ___"]
    svg_contains: ['stroke-dasharray="3 2"']

- id: cs_trace_table_t1_statics_queue_defaults
  feature: trace_table
  tier: 1
  description: 'Traza modo statics para cola con valores por defecto en modo color'
  tinta: false
  block:
    type: trace_table
    operations: ["encolar(a)", "desencolar()"]
  expect:
    ok: true
    min_width: 500
    min_height: 110
    text_contains: ["Operación / Instrucción C", "[0]", "[5]", "Punteros / Índ.", "F:___ R:___", "encolar(a)"]
    svg_contains: ["#1d4ed8"]

- id: cs_trace_table_t2_statics_clamp_max_sin_index_header
  feature: trace_table
  tier: 2
  description: 'Traza statics con capacity=20 acotada a 10 y showIndexHeader=false'
  tinta: true
  block:
    type: trace_table
    capacity: 20
    showIndexHeader: false
    pointerHeader: "Índices"
    pointerLabel: "F=? R=?"
    operations: ["op1"]
  expect:
    ok: true
    min_width: 600
    min_height: 80
    text_contains: ["Índices", "F=? R=?", "op1"]
    text_absent: ["[0]", "[10]"]

- id: cs_trace_table_t2_statics_clamp_min_y_ink_saver
  feature: trace_table
  tier: 2
  description: 'Traza statics con capacity=2 acotada a mínimo 3 celdas y override inkSaver=true'

      - label: "segunda llamada, antes de c++"
        frames: [{function: f}]
  expect:
    ok: true
    min_width: 440
    min_height: 140
    text_contains: ["Pila en ejecución — ñ/á", "segunda llamada, antes de c++"]
    svg_absent: ["#1d4ed8", "#0f172a"]

- id: cs_call_stack_t2_err_frames_vacio
  feature: call_stack
  tier: 2
  description: 'Error cuando frames es lista vacía'
  block:
    type: call_stack
    frames: []
  expect:
    ok: false
    error_contains: "lista de marcos"

- id: cs_call_stack_t2_err_puntero_var_inexistente
  feature: call_stack
  tier: 2
  description: 'Error cuando pointers refiere a una variable inexistente en el marco'
  block:
    type: call_stack
    frames:
      - function: main
        vars: {x: 1}
    pointers: "0.x -> 0.z"
  expect:
    ok: false
    error_contains: "no tiene la variable 'z'"

- id: cs_call_stack_t2_err_max_steps
  feature: call_stack
  tier: 2
  description: 'Error cuando steps supera el máximo permitido de 8 momentos'
  block:
    type: call_stack
    steps:
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
      - {frames: [{function: main}]}
  expect:
    ok: false
    error_contains: "el máximo es 8"

# ===========================================================================
# 2. call_tree (5 Tier 1 + 6 Tier 2 = 11 casos)
# ===========================================================================
- id: cs_call_tree_t1_fib3_orden_y_highlight
  feature: call_tree
  tier: 1
  description: 'Árbol de llamadas fib(3) con orden de preorden, retornos y nodos resaltados'
  tinta: true
  block:
    type: call_tree
    showOrder: true
    highlight: ["fib(3)", "fib(1)"]
    root:
      call: "fib(3)"
      returns: 2
      children:
        - call: "fib(2)"
          returns: 1
          children:
            - {call: "fib(1)", returns: 1}
            - {call: "fib(0)", returns: 0}
        - {call: "fib(1)", returns: 1}
  expect:
    ok: true
    min_width: 220
    min_height: 180
    text_contains: ["fib(3)", "→ 2", "1", "2", "3", "4", "5"]
    svg_contains: ["#e2e8f0"]

- id: cs_call_tree_t1_costos_nivel_y_total_color
  feature: call_tree
  tier: 1
  description: 'Árbol de llamadas en modo color con costos por nivel y fórmula T(n)'
  tinta: false
  block:
    type: call_tree
    levelCosts: ["c", "2c", "2c"]
    total: "2^n"
    root:
      call: "fib(3)"
      returns: 2
      children:
        - call: "fib(2)"
          returns: 1
          children:
            - {call: "fib(1)", returns: 1}
            - {call: "fib(0)", returns: 0}
        - {call: "fib(1)", returns: 1}
  expect:
    ok: true
    min_width: 300
    min_height: 200
    text_contains: ["costo del nivel", "2c", "T(n) = 2^n"]
    svg_contains: ["#1d4ed8"]

- id: cs_call_tree_t1_sin_retornos
  feature: call_tree
  tier: 1
  description: 'Árbol de llamadas sin retornos usando hijos escalares'
  tinta: true
  block:
    type: call_tree
    root:
      call: "merge(0,3)"
      children: ["merge(0,1)", "merge(2,3)"]
  expect:
    ok: true
    min_width: 180
    min_height: 100
    text_contains: ["merge(0,3)", "merge(0,1)", "merge(2,3)"]
    text_absent: ["→"]

- id: cs_call_tree_t1_nodo_escalar_unico

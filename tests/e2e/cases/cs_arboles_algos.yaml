- id: cs_cost_table_t1_blank_total_sin_total_y_ink_saver
  feature: cost_table
  tier: 1
  description: 'blankTotal=true emite T(n) en blanco aun sin clave total, con override inkSaver=false'
  tinta: true
  block:
    type: cost_table
    inkSaver: false
    lines:
      - ["x = 1;", "c1", 1]
    blankTotal: true
  expect:
    ok: true
    min_width: 240
    min_height: 100
    text_contains: ["x = 1;", "c1", "T(n) = ________________________"]
    svg_contains: ["#1d4ed8", "#0f172a"]

- id: cs_cost_table_t2_utf8_y_xml_special_chars
  feature: cost_table
  tier: 2
  description: 'Caracteres UTF-8 y operadores XML (<, >, &) en código y costos'
  tinta: true
  block:
    type: cost_table
    lines:
      - ["if (a < b && c > 0) // ñ", "c₁", "n / 2"]
      - ['    á = "ok";', "c₂", "n"]
    total: "c₁(n/2) + c₂n"
  expect:
    ok: true
    min_width: 310
    min_height: 120
    text_contains: ["if (a < b && c > 0) // ñ", "c₁", "c₂", "T(n) = c₁(n/2) + c₂n"]
    svg_contains: ["&lt; b &amp;&amp; c &gt;"]

- id: cs_cost_table_t2_blank_costs_only
  feature: cost_table
  tier: 2
  description: 'Oculta sólo costos (blankCosts=true) preservando veces y T(n)'
  tinta: true
  block:
    type: cost_table
    lines:
      - ["a = 1;", "c1", "n"]
    blankCosts: true
    total: "n"
  expect:
    ok: true
    min_width: 195
    min_height: 100
    text_contains: ["a = 1;", "n", "T(n) = n"]
    text_absent: ["c1"]
    svg_contains: ['stroke-dasharray="3 2"']

- id: cs_cost_table_t2_lista_4_elementos_fallback
  feature: cost_table
  tier: 2

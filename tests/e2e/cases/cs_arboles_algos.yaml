# 4. struct (5 Tier 1 + 6 Tier 2 = 11 casos)
# ===========================================================================
- id: cs_struct_t1_layout_padding_lp64_y_typedef
  feature: struct
  tier: 1
  description: 'Disposición LP64 GCC con relleno interno y final, valores y typedef'
  tinta: true
  block:
    type: struct
    name: "struct s"
    typedef: s_t
    fields: ["char a = 'A'", "int b = 30", "char c = 'Z'"]
  expect:
    ok: true
    min_width: 270
    min_height: 220
    text_contains: ["typedef struct s s_t;", "+0", "+4", "+8", "(relleno)", "3 B", "sizeof(s_t) = 12 bytes | alineación: 4"]
    svg_contains: ['stroke-dasharray="4 3"']


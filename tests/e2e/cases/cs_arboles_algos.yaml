# Suite E2E CS Árboles y Algoritmos: 9 tipos (call_stack, call_tree, tree, struct, adt, complexity, flowchart, cost_table, trace_table).
# >= 5 Tier 1 + >= 5 Tier 2 por tipo (102 casos totales).
# Derivado de `alucarD/generador_examenes/diagramas.py` y `alucarD/tests/test_diagramas.py`.

# ===========================================================================
# 1. call_stack (5 Tier 1 + 6 Tier 2 = 11 casos)
# ===========================================================================
- id: cs_call_stack_t1_marcos_dirs_punteros
  feature: call_stack
  tier: 1
  description: 'Pila de llamadas LP64 con showAddresses, showTypes, returnTo y 2 punteros entre marcos'
  tinta: true
  block:
    type: call_stack
    showAddresses: true
    showTypes: true
    frames:
      - function: main
        vars:
          - {name: a, value: 3, type: int}
          - {name: b, value: 7, type: int}
      - function: intercambiar
        returnTo: main
        params:
          - {name: x, value: "&a", type: "int *"}
          - {name: y, value: "&b", type: "int *"}
        vars: ["aux = 3"]
    pointers: "1.x -> 0.a; intercambiar.y -> main.b"
  expect:
    ok: true
    min_width: 240
    min_height: 200
    text_contains: ["intercambiar(x, y)", "main()", "vuelve a main", "int * x", "&a", "0x7FFC", "0x7FF8", "0x7FF0", "0x7FE8", "0x7FE4", "base de la pila"]
    svg_contains: ["marker-end", "&amp;a"]

- id: cs_call_stack_t1_steps_popped_color
  feature: call_stack
  tier: 1
  description: 'Evolución en el tiempo con steps, returns y marco popped punteado en modo color'
  tinta: false
  block:
    type: call_stack
    steps:
      - label: "llama a fact(2)"
        frames:
          - {function: main, vars: {r: "?"}}
          - {function: fact, params: {n: 2}}
      - label: "fact(1) devuelve 1"
        frames:
          - {function: main, vars: {r: "?"}}
          - {function: fact, params: {n: 2}}
          - {function: fact, params: {n: 1}, returns: 1, popped: true}
  expect:
    ok: true
    min_width: 330
    min_height: 180
    text_contains: ["llama a fact(2)", "fact(1) devuelve 1", "devolvió 1", "fact(n)"]
    svg_contains: ["#1d4ed8", 'stroke-dasharray="5 3"']

- id: cs_call_stack_t1_sin_direcciones_ni_tipos
  feature: call_stack
  tier: 1
  description: 'Pila de llamadas sin direcciones ni tipos con label superior y valores compuestos'
  tinta: true
  block:
    type: call_stack
    label: "Estado inicial"
    frames:
      - function: procesar
        vars:
          a: 10
          ok: true
          arr: [1, 2]
  expect:
    ok: true
    min_width: 140
    min_height: 120
    text_contains: ["Estado inicial", "procesar()", "10", "true", "[1, 2]"]
    text_absent: ["0x7FFC"]

- id: cs_call_stack_t1_vars_con_addr_y_size
  feature: call_stack
  tier: 1
  description: 'Variables con addr explícita, size personalizado y typeSize=8'
  tinta: true
  block:
    type: call_stack
    showAddresses: true
    baseAddr: "0x9000"
    typeSize: 8
    frames:
      - function: leer
        vars:
          - {name: buf, value: "ok", size: 16, addr: "0x8000"}
          - {name: p, value: "&buf", type: "char *"}
  expect:
    ok: true
    min_width: 190
    min_height: 120
    text_contains: ["leer()", "0x8000", "0x7FF8", "buf", "ok", "p"]

- id: cs_call_stack_t1_pointers_lista_recursivo
  feature: call_stack
  tier: 1
  description: 'Punteros en formato lista YAML desambiguando marcos homónimos por índice'
  tinta: false
  block:
    type: call_stack
    frames:
      - function: f
        vars: {x: 1}
      - function: f
        vars: {p: "&x"}
    pointers: ["1.p -> 0.x"]
  expect:
    ok: true
    min_width: 150
    min_height: 150
    text_contains: ["f()", "base de la pila"]
    svg_contains: ["#1d4ed8", "marker-end"]

- id: cs_call_stack_t2_marco_sin_variables
  feature: call_stack
  tier: 2

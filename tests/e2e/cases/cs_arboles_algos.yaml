    lines:
      - [1, 2, 3, 4]
  expect:
    ok: true
    min_width: 230
    min_height: 80
    text_contains: ["[1, 2, 3, 4]"]

- id: cs_cost_table_t2_err_sin_lines
  feature: cost_table

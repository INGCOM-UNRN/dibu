    operations:
      - {signature: "pila_t crear(void)", kind: constructor, post: "pila vacía"}
      - {signature: "bool apilar(pila_t p, int x)", kind: mutador, pre: "p != NULL"}
    client: ["pila_t p = crear();", "apilar(p, 5);"]
    invariant: "tope >= 0"
    representations:
      - "Arreglo dinámico"
      - {name: "Lista enlazada", fields: ["nodo_t *cabeza", "size_t cant"]}
  expect:
    ok: true
    min_width: 450
    min_height: 300

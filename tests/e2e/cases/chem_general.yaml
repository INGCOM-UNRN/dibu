- id: chem_vsepr_t2_blank_selectivo_xef4
  feature: vsepr
  tier: 2
  description: 'Fixture `trepev-xef4-blanco`: `blank` selectivo oculta nombre, ángulo e hibridación'
  tinta: true
  block:
    type: vsepr
    title: XeF4 (para completar)
    central: Xe
    ligands: [F, F, F, F]

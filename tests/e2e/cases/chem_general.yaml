# Suite E2E Química General: 13 tipos × (>=5 Tier 1 + >=5 Tier 2) = 162 casos.
# Tipos: molecule, reaction, vsepr, orbitals, energy_profile, titration, speciation,
#        kinetics, phase_diagram, heating_curve, spectrum, galvanic_cell, unit_cell.
# Derivado de `fixtures/diagramas_quimica.yaml`, `alucarD/tests/test_diagramas_quimica.py`,
# `spec_part1.md` y `spec_part2.md`.

# ===========================================================================
# 1. molecule (6 Tier 1 + 7 Tier 2 = 13 casos)
# ===========================================================================
- id: chem_molecule_t1_lewis_agua
  feature: molecule
  tier: 1
  description: 'Fixture `lewis-agua`: estructura de Lewis del agua con pares libres'
  tinta: true
  block:
    type: molecule
    title: Estructura de Lewis del agua
    atoms:
      - {id: o, el: O, at: [0, 0], lonePairs: 2}
      - {id: h1, el: H, from: o, angle: 218}
      - {id: h2, el: H, from: o, angle: 322}
  expect:
    ok: true
    min_width: 100
    min_height: 80
    text_contains: ["Estructura de Lewis del agua", "O", "H"]
    svg_contains: ["<circle"]

- id: chem_molecule_t1_resonancia_nitrato_cargas
  feature: molecule
  tier: 1
  description: 'Fixture `lewis-nitrato`: cargas formales positivas y negativas con enlace doble'
  tinta: true
  block:
    type: molecule
    title: Una estructura resonante del nitrato
    atoms:
      - {id: n, el: N, at: [0, 0], charge: 1}
      - {id: o1, el: O, from: n, angle: 90, bond: 2, lonePairs: 2}
      - {id: o2, el: O, from: n, angle: 210, lonePairs: 3, charge: -1}
      - {id: o3, el: O, from: n, angle: 330, lonePairs: 3, charge: -1}
  expect:
    ok: true
    min_width: 120
    min_height: 100
    text_contains: ["Una estructura resonante del nitrato", "N", "+", "O", "−"]

- id: chem_molecule_t1_esqueletal_anillos_fusionados
  feature: molecule
  tier: 1
  description: 'Fixture `naftaleno-kekule`: anillos hexagonales fusionados esqueletales con enlaces dobles'
  tinta: true
  block:
    type: molecule
    title: Naftaleno (Kekulé, anillos fusionados)
    skeletal: true
    rings:
      - {size: 6, center: [0, 0], start: 30, kekule: true}
      - {size: 6, center: [1.732, 0], start: 30}
    bonds:
      - [r1_1, r1_2, 2]
      - [r1_5, r1_0, 2]
  expect:
    ok: true
    min_width: 150
    min_height: 100
    text_contains: ["Naftaleno (Kekulé, anillos fusionados)"]
    text_absent: ["C"]

- id: chem_molecule_t1_benceno_esqueletal_aromatico
  feature: molecule
  tier: 1
  description: 'Fixture `benceno-esqueletal`: anillo aromático (`aromatic: true`) con aro inscripto y sustituyente exocíclico'
  tinta: true
  block:
    type: molecule
    title: Ácido benzoico (esqueletal)
    skeletal: true
    rings:
      - {size: 6, center: [0, 0], ids: [c1, c2, c3, c4, c5, c6], aromatic: true}
    atoms:
      - {id: c7, from: c1, angle: 90}
      - {id: o1, el: O, from: c7, angle: 30, bond: 2}
      - {id: o2, el: OH, from: c7, angle: 150}
  expect:
    ok: true
    min_width: 120
    min_height: 120
    text_contains: ["Ácido benzoico (esqueletal)", "O", "OH"]
    text_absent: ["C"]
    svg_contains: ["<circle"]

- id: chem_molecule_t1_estereo_wedge_hash_caption
  feature: molecule
  tier: 1
  description: 'Fixture `estereo` ampliado con caption y estereoquímica cuña/rayas'
  tinta: true
  block:
    type: molecule
    title: Un carbono quiral con cuña y rayas
    caption: "Quiral (C*)"
    atoms:
      - {id: c, el: C, at: [0, 0]}
      - {id: br, el: Br, from: c, angle: 90}
      - {id: h, el: H, from: c, angle: 210, bond: {stereo: hash}}
      - {id: cl, el: Cl, from: c, angle: 330, bond: {stereo: wedge}}
      - {id: f, el: F, from: c, angle: 270, length: 0.9, bond: {order: 1}}
  expect:
    ok: true
    min_width: 120
    min_height: 120
    text_contains: ["Un carbono quiral con cuña y rayas", "C", "Br", "H", "Cl", "F", "Quiral (C*)"]
    svg_contains: ["<polygon"]

- id: chem_molecule_t1_mecanismo_flechas_curvas_color
  feature: molecule
  tier: 1
  description: 'Fixture `mecanismo-sn2` con flecha curva y media punta en modo color'
  tinta: false
  block:
    type: molecule
    title: "S_N\\2 (flechas curvas)"
    atoms:
      - {id: oh, el: HO, at: [-2.2, 0], charge: -1, lonePairs: 2}
      - {id: c, el: C, at: [0, 0]}
      - {id: br, el: Br, from: c, angle: 0, lonePairs: 3}
      - {id: h1, el: H, from: c, angle: 90}
      - {id: h2, el: H, from: c, angle: 225}
      - {id: h3, el: H, from: c, angle: 135, length: 0.8}
    arrows:
      - {from: oh, to: c, bend: 1}
      - {from: [c, br], to: br, bend: -1, half: true}
  expect:
    ok: true
    min_width: 150
    min_height: 100
    text_contains: ["SN2", "HO", "C", "Br", "H"]
    svg_contains: ["Q ", "#1d4ed8", "#0f172a"]

- id: chem_molecule_t2_blank_atomo_enlace_parcial_inksaver
  feature: molecule
  tier: 2
  description: 'Átomo `blank`, radical, `note` UTF-8, órdenes 0.5/1.5, enlace `blank` y override `inkSaver`'
  tinta: false
  block:
    type: molecule
    inkSaver: true
    atoms:
      - {id: a, el: C, at: [0, 0], blank: true, radical: 1, note: "α-C"}
      - {id: b, el: O, from: a, angle: 0, bond: {order: 0.5}}
      - {id: c, el: N, from: b, angle: 0, bond: {order: 1.5}}
      - {id: d, el: H, from: c, angle: 0, bond: {blank: true}}
  expect:
    ok: true
    min_width: 120
    min_height: 50
    text_contains: ["α-C", "O", "N", "H"]
    svg_contains: ["stroke-dasharray=\"3 2\"", "stroke-dasharray=\"2 3\"", "stroke-dasharray=\"4 3\""]
    svg_absent: ["#1d4ed8", "#0f172a"]

- id: chem_molecule_t2_skeletal_c_aislado_y_bond_false
  feature: molecule
  tier: 2
  description: 'En `skeletal: true`, carbono aislado es visible y `bond: false` omite enlace'
  tinta: true
  block:
    type: molecule
    skeletal: true
    atoms:
      - {id: c1, el: C, at: [0, 0]}
      - {id: o1, el: O, at: [2, 0]}
      - {id: c2, el: C, from: o1, angle: 0, bond: false, show: true}
      - {id: c3, el: C, from: o1, angle: 180, note: "oculto"}
  expect:
    ok: true
    min_width: 100
    min_height: 40
    text_contains: ["C", "O"]
    text_absent: ["oculto"]

- id: chem_molecule_t2_anillo_actualiza_atomo_utf8
  feature: molecule
  tier: 2
  description: 'Anillo de 5 miembros con actualización de vértice existente y fórmula UTF-8 en caption'
  tinta: true
  block:
    type: molecule
    rings:
      - {size: 5, ids: [c1, c2, c3, c4, c5], el: [N, C, C, C, C]}
    atoms:
      - {id: c1, el: NH, charge: "+1"}
    caption: "H2O + NH4^+"
  expect:
    ok: true
    min_width: 90
    min_height: 90
    text_contains: ["NH", "+1", "H2O + NH4+"]

- id: chem_molecule_t2_err_sin_atomos
  feature: molecule
  tier: 2
  description: 'Error controlado cuando faltan `atoms` y `rings`'
  block:
    type: molecule
  expect:
    ok: false
    error_contains: "faltan atoms"

- id: chem_molecule_t2_err_anillo_size_invalido
  feature: molecule
  tier: 2
  description: 'Error controlado cuando `rings[0].size` está fuera de 3..8'
  block:
    type: molecule
    rings:
      - {size: 9}
  expect:
    ok: false
    error_contains: "de 3 a 8 átomos"

- id: chem_molecule_t2_err_atomo_inexistente
  feature: molecule
  tier: 2
  description: 'Error controlado cuando `from` referencia un átomo inexistente'
  block:
    type: molecule
    atoms:
      - {id: a, el: C}
      - {id: b, from: z}
  expect:
    ok: false
    error_contains: "no hay un átomo"

- id: chem_molecule_t2_err_orden_invalido
  feature: molecule
  tier: 2
  description: 'Error controlado cuando un enlace tiene orden inválido (4)'
  block:
    type: molecule
    atoms:
      - {el: C}
      - {from: a0, angle: 0}
    bonds:
      - [a0, a1, 4]
  expect:
    ok: false
    error_contains: "bonds[0].order"

# ===========================================================================
# 2. reaction (5 Tier 1 + 6 Tier 2 = 11 casos)
# ===========================================================================
- id: chem_reaction_t1_esterificacion_equilibrio
  feature: reaction
  tier: 1
  description: 'Fixture `reaccion-esterificacion`: equilibrio `<=>` con condiciones above/below'
  tinta: true
  block:
    type: reaction
    title: Esterificación de Fischer
    steps:
      - "CH3COOH"
      - "+"
      - "CH3CH2OH"
      - {arrow: "<=>", above: "H2SO4", below: "Δ"}
      - "CH3COOCH2CH3"
      - "+"
      - "H2O"
  expect:
    ok: true
    min_width: 300
    min_height: 70
    text_contains: ["Esterificación de Fischer", "CH3COOH", "+", "CH3CH2OH", "H2SO4", "Δ", "CH3COOCH2CH3", "H2O"]

- id: chem_reaction_t1_resonancia_moleculas
  feature: reaction
  tier: 1
  description: 'Fixture `reaccion-resonancia`: moléculas embebidas con flecha de resonancia `<->`'
  tinta: true
  block:
    type: reaction
    title: Resonancia del ion carboxilato
    steps:
      - atoms:
          - {id: c, el: C, at: [0, 0]}
          - {id: r, el: R, from: c, angle: 180}
          - {id: o1, el: O, from: c, angle: 60, bond: 2, lonePairs: 2}
          - {id: o2, el: O, from: c, angle: 300, lonePairs: 3, charge: -1}
      - {arrow: "<->"}
      - atoms:
          - {id: c, el: C, at: [0, 0]}
          - {id: r, el: R, from: c, angle: 180}
          - {id: o1, el: O, from: c, angle: 60, lonePairs: 3, charge: -1}
          - {id: o2, el: O, from: c, angle: 300, bond: 2, lonePairs: 2}
  expect:
    ok: true
    min_width: 220
    min_height: 100
    text_contains: ["Resonancia del ion carboxilato", "C", "R", "O", "−"]
    svg_contains: ["marker-start=\"url(#flecha-main-"]

- id: chem_reaction_t1_retrosintesis_formula_dict
  feature: reaction
  tier: 1
  description: 'Flecha de retrosíntesis `=>` y paso `{formula: ...}`'
  tinta: true
  block:
    type: reaction
    steps:
      - {formula: "C6H5CHO"}
      - {arrow: "=>", above: "FGI"}
      - "C6H5CH2OH"
  expect:
    ok: true
    min_width: 180
    min_height: 45
    text_contains: ["C6H5CHO", "FGI", "C6H5CH2OH"]

- id: chem_reaction_t1_coeficientes_numericos_color
  feature: reaction
  tier: 1
  description: 'Coeficientes estequiométricos numéricos y flecha Unicode `→` en modo color'
  tinta: false
  block:
    type: reaction
    steps:
      - 2
      - "H2"
      - "+"
      - "O2"
      - {arrow: "→", above: "Pt"}
      - 2
      - "H2O"
  expect:
    ok: true
    min_width: 200
    min_height: 45
    text_contains: ["2", "H2", "O2", "Pt", "H2O"]
    svg_contains: ["#1d4ed8", "#0f172a"]

- id: chem_reaction_t1_wrap_multilinea
  feature: reaction
  tier: 1
  description: 'Salto de línea automático al superar `maxWidth: 160`'
  tinta: true
  block:
    type: reaction
    maxWidth: 160
    steps: ["CH4", "+", "2 O2", {arrow: "->"}, "CO2", "+", "2 H2O"]
  expect:
    ok: true
    min_width: 120
    min_height: 95
    text_contains: ["CH4", "2 O2", "CO2", "2 H2O"]

- id: chem_reaction_t2_blank_producto_y_flecha
  feature: reaction
  tier: 2
  description: 'Fixture `reaccion-completar` ampliado: caja `blank` con `width: 60` y flecha `blank: true` con `below`'
  tinta: true
  block:
    type: reaction
    steps:
      - "Zn"
      - "+"
      - "2 HCl"
      - {arrow: "->", blank: true, above: "oculto", below: "25 °C"}
      - {blank: true, width: 60}
      - "+"
      - "H2"
  expect:
    ok: true
    min_width: 240
    min_height: 45
    text_contains: ["Zn", "2 HCl", "25 °C", "H2"]
    text_absent: ["oculto"]
    svg_contains: ["stroke-dasharray=\"3 2\"", "<rect"]

- id: chem_reaction_t2_flecha_eq_above_largo_inksaver
  feature: reaction
  tier: 2
  description: 'Alias `eq`, texto `above` largo UTF-8 y override `inkSaver: true` sobre `tinta: false`'
  tinta: false
  block:
    type: reaction
    inkSaver: true
    steps:
      - "N2O4"
      - {arrow: "eq", above: "ΔH° = +57,2 kJ/mol", below: "T = 298 K"}
      - "2 NO2"
  expect:
    ok: true
    min_width: 200
    min_height: 45
    text_contains: ["N2O4", "ΔH° = +57,2 kJ/mol", "T = 298 K", "2 NO2"]
    svg_absent: ["#1d4ed8", "#0f172a"]

- id: chem_reaction_t2_err_steps_vacio
  feature: reaction
  tier: 2
  description: 'Error controlado cuando `steps` está vacío'
  block:
    type: reaction
    steps: []
  expect:
    ok: false
    error_contains: "'steps' es una lista"

- id: chem_reaction_t2_err_step_booleano
  feature: reaction
  tier: 2
  description: 'Error controlado cuando un paso de `reaction` es booleano'
  block:
    type: reaction
    steps: [true]
  expect:
    ok: false
    error_contains: "una fórmula, '+'"

- id: chem_reaction_t2_err_flecha_invalida
  feature: reaction
  tier: 2
  description: 'Error controlado para símbolo de flecha inválido (`~>`)'
  block:
    type: reaction
    steps:
      - {arrow: "~>"}
  expect:
    ok: false
    error_contains: "steps[0].arrow"

- id: chem_reaction_t2_err_molecula_interna_invalida
  feature: reaction
  tier: 2
  description: 'Error controlado propagado desde molécula embebida inválida'
  block:
    type: reaction
    steps:
      - atoms:
          - {id: a, el: C}
          - {id: b, from: x}
  expect:
    ok: false
    error_contains: "no hay un átomo"

# ===========================================================================
# 3. vsepr (5 Tier 1 + 7 Tier 2 = 12 casos)
# ===========================================================================
- id: chem_vsepr_t1_piramidal_amoniaco
  feature: vsepr
  tier: 1
  description: 'Fixture `trepev-amoniaco`: inferencia AX3E por pares libres'
  tinta: true
  block:
    type: vsepr
    title: Amoníaco
    central: N
    ligands: [H, H, H]
    lonePairs: 1
  expect:
    ok: true
    min_width: 480
    min_height: 200
    text_contains: ["Amoníaco", "N", "H", "AX3E", "piramidal trigonal", "≈ 107°", "sp³"]

- id: chem_vsepr_t1_balancin_sf4
  feature: vsepr
  tier: 1
  description: 'Fixture `trepev-sf4`: geometría balancín AX4E sp³d'
  tinta: true
  block:
    type: vsepr
    title: SF4
    central: S
    ligands: [F, F, F, F]
    lonePairs: 1
  expect:
    ok: true
    min_width: 480
    min_height: 200
    text_contains: ["SF4", "AX4E", "balancín", "< 90° y < 120°", "sp³d"]

- id: chem_vsepr_t1_octaedrica_sf6
  feature: vsepr
  tier: 1
  description: 'Fixture `trepev-sf6`: geometría octaédrica AX6 sin pares libres'
  tinta: true
  block:
    type: vsepr
    central: S
    ligands: [F, F, F, F, F, F]
  expect:

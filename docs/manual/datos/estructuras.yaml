# Estructuras de datos y algoritmos.

array:
  nombre: Arreglo
  para: Arreglos en memoria, con índices, direcciones, offsets, punteros que los recorren y su límite excluido, cadenas de C y secuencias de Python con sus cortes.
  resumen: |
    Dibuja un arreglo como una fila de celdas contiguas, con el índice de cada una y,
    opcionalmente, su dirección de memoria y su offset desde el comienzo. Los punteros o índices
    que lo recorren se dibujan como flechas sobre la celda a la que apuntan; uno en la posición
    `n` señala el límite excluido (`a + n`), en el borde derecho y sin una celda `a[n]`. `range`
    marca un intervalo semiabierto `[start, stop)`. Con `variant: c_string`, un arreglo de `char`
    con su terminador; con `variant: python_sequence`, una lista, tupla o cadena de Python, con
    índices negativos, fronteras y un corte (`slice`).
  calcula:
    - La dirección de cada celda a partir de `baseAddr` y del tamaño del elemento (`typeSize`).
    - "En `python_sequence`, las celdas que elige un corte, con las reglas de `slice.indices(n)`: los límites fuera de rango se ajustan, y el resultado se escribe como en Python (`[4, 1]`, `(4,)`, `'aloh'`)."
  variantes:
    c_string: "Una cadena de C en un arreglo de `capacity` bytes: el primer `'\\0'` fija la longitud (`strlen`), los bytes declarados después del terminador se ven atenuados y la capacidad sin datos declarados, punteada. Sin terminador dentro de la capacidad, lo dice y no muestra un `strlen`. `char s[4] = \"hola\"` (con `text` y `capacity: 4`) no lleva terminador, como en C."
    python_sequence: "Una secuencia de Python (`kind`): el índice positivo y, con `showNegativeIndices`, el negativo de cada elemento; con `showBoundaries`, las fronteras entre celdas (de `0` a `n`). Con `slice`, resalta las celdas elegidas, numera el orden de visita si el paso no es 1, marca el inicio y el fin (el límite excluido) y escribe el resultado."
  campos:
    values: Los valores, en orden. Un valor vacío (`""`) deja la celda sin contenido.
    capacity: Cantidad total de celdas; las que sobran después de `values` se dibujan vacías (el espacio reservado sin usar).
    pointers: 'Punteros o índices sobre el arreglo, como texto `"p:0, q:3"` (nombre y posición). La posición `n` (una más que la última celda) es el límite excluido: se marca en el borde, sin una celda.'
    range: 'Un intervalo semiabierto `{start, stop, label, order, blank}` debajo de las celdas: `[` en el inicio (incluido) y `)` en el fin (excluido), de `0` a `n`; `start` igual a `stop` es el intervalo vacío. `order: true` (o `reverse`) numera el orden de visita; `blank: true` lo deja para dibujar.'
    showIndices: Muestra el índice de cada celda (por omisión, sí).
    showAddresses: Muestra la dirección de cada celda.
    showOffsets: Muestra el desplazamiento en bytes de cada celda respecto del comienzo.
    baseAddr: 'Dirección de la primera celda, en hexadecimal (`0x1000`) o simbólica (`"@A"`).'
    typeSize: Tamaño de cada elemento en bytes (por omisión 4, un `int`).
    blankValues: Deja los valores en blanco, para completar.
    blankAddrs: Deja las direcciones en blanco, para calcularlas.
    variant: Variante, ver arriba.
    text: En `c_string`, la cadena (ASCII); se le agrega el terminador si entra en `capacity`.
    bytes: "En `c_string`, los bytes uno por uno: un carácter (`'a'`), `'\\0'` o `0` (el terminador), `'\\n'`, un número de 0 a 255, o `null` (una posición sin dato declarado)."
    blank: En `c_string`, los índices de las celdas que se dejan en blanco, para completar.
    blankLength: En `c_string`, deja en blanco la longitud (`strlen`) y las bandas que la delatan.
    kind: "En `python_sequence`: `list` (por omisión), `tuple` o `str`. En `str`, `values` es un texto y cada celda es un carácter; un espacio se ve como `␣`."
    name: En `python_sequence` y `c_string`, el nombre de la variable (por omisión `a`, `t` o `s`).
    showNegativeIndices: En `python_sequence`, el índice negativo de cada elemento.
    showBoundaries: En `python_sequence`, las fronteras entre celdas, de `0` a `n`.
    slice: "En `python_sequence`, un corte `{start, stop, step, blankSelection}`; cualquiera se puede omitir, y `{step: -1}` es `[::-1]`. El paso 0 es un error. Con `blankSelection: true` no se ve ninguna pista de la solución: ni las celdas elegidas, ni el inicio y el fin, ni el resultado."
  ejercicio: |
    En `python_sequence`, `slice` con `blankSelection: true` deja el corte para resolver: se ve la
    expresión (`a[-4:-1:2]`) y un casillero para el resultado.
  notas:
    - Para un arreglo de dos dimensiones, ver [`matrix`](matrix.md).
    - En `python_sequence` no hay direcciones de memoria; hasta 16 elementos. En `c_string`, hasta 24 bytes.
  sin_ejemplo: [capacity]

matrix:
  nombre: Matriz
  para: Matrices estáticas, dinámicas, dentadas, planas, con punteros a filas de un solo bloque y de Java, como están en memoria.
  resumen: |
    Dibuja una matriz y cómo está guardada en memoria. La estática muestra la declaración
    (`int m[3][4]`) y, con `showAddresses`, la dirección de cada celda en orden de filas; la
    dinámica, el puntero, el arreglo de punteros a filas y cada fila; la dentada, filas de distinto
    largo con el arreglo de largos o un centinela; la plana, un único bloque contiguo con la cuenta
    `m[i * C + j]`; la de Java, un arreglo de arreglos (`int[][]`) con cada fila como objeto aparte.
  calcula:
    - La dirección de cada celda en orden de filas.
    - En la plana, el índice lineal de cada `(i, j)`.
    - En la dentada, el arreglo de largos a partir de las filas.
  variantes:
    static: Por omisión. `int m[F][C]` en un bloque, con `showLinear` también fila por fila en memoria.
    dynamic: 'Un `int **`: el puntero, el arreglo de punteros a filas y cada fila por separado; `null` es un puntero a NULL.'
    jagged: Dinámica con filas de distinto largo, con el arreglo de largos (`showLengths`) o un `sentinel` al final de cada fila.
    flat: 'Un `int *` con `F * C` elementos contiguos: cada celda con su índice `[k]` y su `(i, j)`.'
    row_pointers: 'Un `int **` con una tabla de punteros a filas y un solo bloque de `F * C` datos: `m[i]` apunta al índice `i * C` del bloque (para 2×3, la fila 1 empieza en el 3). Son dos reservas y se liberan las dos (`free(m[0]); free(m);`). Para comparar con `dynamic`, que reserva cada fila por separado.'
    java: 'Un `int[][]` de Java: la variable refiere al arreglo exterior, que guarda una referencia por fila; cada fila es un objeto con su `length`. `null` es una referencia nula y `[]`, una fila de largo cero; `values: []` es un arreglo exterior vacío.'
  campos:
    values: Lista de filas (o lista plana junto con `cols`). En la dinámica, `null` es una fila que es NULL; en la de Java, una referencia `null`, y `[]` una fila de largo cero.
    rows: Cantidad de filas, si no salen de `values` (de 1 a 10).
    cols: Cantidad de columnas (de 1 a 10).
    variant: Variante, ver arriba.
    name: Nombre de la variable (por omisión `m`).
    elementType: Tipo de los elementos, para la declaración (por omisión `int`).
    typeSize: Tamaño de cada elemento en bytes.
    showIndices: Muestra los índices de filas y columnas.
    showAddresses: Muestra la dirección de cada celda.
    baseAddr: Dirección de la primera celda (o del bloque, en la plana).
    rowAddresses: En la dinámica, la dirección de cada fila.
    rowsBaseAddr: En la dinámica, la dirección del arreglo de punteros a filas.
    highlight: 'Celdas resaltadas, como `"1,2; 0,0"` o `[[1, 2]]`.'
    highlightRows: Filas resaltadas.
    highlightCols: Columnas resaltadas.
    blankValues: Deja los valores en blanco.
    blankAddrs: Deja las direcciones en blanco.
    blankPointers: En `row_pointers`, deja la tabla de punteros sin flechas, para deducir a qué índice apunta cada fila.
    showLinear: En la estática, dibuja además la matriz como está en memoria, una fila detrás de la otra.
    showLengths: En la dentada, el arreglo de largos (por omisión, sí).
    lengths: En la dentada, los largos, si no salen de las filas.
    lengthsName: Nombre del arreglo de largos.
    lengthsType: Tipo de los largos (por omisión `size_t`).
    lengthsAddr: Dirección del arreglo de largos.
    blankLengths: Deja los largos en blanco (en la de Java, cada `length`).
    sentinel: 'En la dentada, un valor centinela al final de cada fila, como `"''\\0''"` o `-1`.'
    showCoords: En la plana, el `(i, j)` de cada celda (por omisión, sí).
    showFormula: En la plana, la fórmula `m[i * C + j]` (por omisión, sí).
    showLogical: En la plana, agrega la matriz como la piensa el programa.
    zones: Enmarca el stack y el heap; `true` usa esos títulos, o `{stack, heap}` con títulos propios.
    owner: 'Una estructura dueña de la matriz en lugar del puntero: `name`, `type` y `fields` (`"filas -> rows"`, `"largos -> lengths"`).'
  notas:
    - El máximo es 10 filas por 10 columnas; en la plana y en `row_pointers`, 24 celdas.
    - 'Para una reserva parcial de filas (un `malloc` que falla a mitad de camino), ver [`object_heap`](../memoria/object_heap.md) con `variant: c` y un instante por paso.'
    - Las direcciones simbólicas (`"@F"`) van entre comillas en YAML.

linked_list:
  nombre: Lista enlazada
  para: Listas simples, dobles y circulares, con direcciones, cursores y estructura cabecera.
  resumen: |
    Dibuja los nodos de una lista enlazada con su valor y el puntero al siguiente (y al anterior,
    en las dobles), la cabeza y los cursores que la recorren. Puede mostrar dónde vive cada cosa:
    la cabeza o una estructura cabecera en el stack y los nodos en el heap.
  variantes:
    singly: Por omisión. Cada nodo apunta al siguiente; el último, a NULL.
    doubly: Cada nodo apunta al siguiente y al anterior.
    circular: El último apunta al primero.
    circular_doubly: Doble y circular.
  campos:
    values: Los valores de los nodos, en orden (hasta 7). `[]` es la lista vacía.
    variant: Variante, ver arriba.
    addresses: La dirección de cada nodo (hexadecimal o simbólica, como `"@N1"`).
    headLabel: El rótulo de la cabeza (por omisión `HEAD`).
    pointers: 'Cursores sobre la lista, como `"ant:0, actual:1"`.'
    drawArrows: Dibuja las flechas entre nodos (por omisión, sí).
    nodeType: Rotula cada nodo con su tipo, `@N1 (nodo_t)`.
    header: 'Una estructura cabecera en lugar de la cabeza: `name`, `type` y `fields` (`"primero -> 0"`, `"cant = 3"`).'
    zones: Enmarca el stack y el heap; `true` o `{stack, heap}` con títulos propios.
    blankValues: Deja los valores en blanco.
    blankNextAddrs: Deja en blanco las direcciones de los punteros al siguiente.

stack:
  nombre: Pila
  para: Pilas en arreglo, con el tope, y su evolución paso a paso.
  resumen: |
    Dibuja una pila de abajo hacia arriba, con el tope marcado. Con `layout: vertical_multi`
    muestra varios momentos de la misma pila uno al lado del otro, para seguir una secuencia de
    apilar y desapilar.
  campos:
    values: Los valores desde la base hasta el tope. Con `vertical_multi`, una lista de estados.
    capacity: Cantidad de lugares de la pila; los libres se dibujan vacíos.
    topIndex: Índice del tope, si no es el último valor.
    topLabel: Rótulo del tope (por omisión `tope`).
    label: Rótulo de la pila.
    layout: '`vertical_multi` dibuja varios estados uno al lado del otro.'
    traceLabels: Con `vertical_multi`, el rótulo de cada estado (por ejemplo, la operación).
    showAddresses: Muestra la dirección de cada lugar.
    baseAddr: Dirección de la base.
    typeSize: Tamaño de cada elemento en bytes.
    blankValues: Deja los valores en blanco.
    blankPointers: Deja el tope en blanco.
  sin_ejemplo: [capacity]

queue:
  nombre: Cola
  para: Colas lineales y circulares, con frente y final o con frente y cantidad, y deques circulares.
  resumen: |
    Dibuja una cola en arreglo con los índices de frente y final. La circular se dibuja como un
    anillo y, con `showPanel`, con un panel que resume frente, final y cantidad. Las variantes
    `ring` y `deque` usan otra convención: la capacidad, el índice del frente y los valores en
    orden lógico; dibu ubica cada valor en su celda física, con la vuelta del índice.
  calcula:
    - 'En `ring` y `deque`: la celda de cada valor, `(frente + k) % N`; la cantidad (el largo de `values`); el último ocupado, `(frente + cantidad - 1) % N`, y el siguiente para agregar al final, `(frente + cantidad) % N`, que en una cola llena coincide con el frente.'
  variantes:
    linear: Por omisión. Un arreglo con frente y final.
    circular: 'Un anillo de `capacity` lugares, con `values` en orden físico (`values[i]` en la celda `i`) y `FINAL` como el último insertado.'
    ring: Una cola circular por frente y cantidad, con `values` en orden lógico, el orden de cada valor y un panel con frente, cantidad, último y siguiente, y encolar y desencolar.
    deque: Como `ring`, con las operaciones de una deque (agregar y quitar en los dos extremos).
  campos:
    values: 'Los valores en la cola, del frente al final. En `circular`, en orden físico; en `ring` y `deque`, en orden lógico (el primero va en `frontIndex`).'
    variant: Variante, ver arriba.
    capacity: Cantidad de lugares.
    frontIndex: Índice del frente.
    rearIndex: Índice del final.
    showPanel: En la circular, un panel con frente, final y cantidad.
    blankValues: Deja los valores en blanco.
    blankPointers: Deja frente y final en blanco.
    blank: 'En `ring` y `deque`, lo que se deja en blanco, por separado: `front`, `last`, `count`, `next`, `values` y `order`.'

call_stack:
  nombre: Pila de llamadas
  para: Los marcos de activación de una ejecución, con parámetros, variables y punteros entre marcos.
  resumen: |
    Dibuja los marcos de activación desde `main` (abajo) hasta el tope, que se resalta. Los
    parámetros van en negrita y figuran en el título del marco. Con `steps`, la pila aparece en
    varios momentos alineados en la base; un marco con `popped: true` y `returns` es el que acaba
    de retornar y se dibuja punteado.
  calcula:
    - Las direcciones de las variables, desde `baseAddr` hacia abajo, según el tamaño de cada una.
  campos:
    frames: 'Los marcos, de `main` al tope. Cada uno con `function`, `params`, `vars`, `returnTo`, `returns` y `popped`. Las variables van como `{x: 5}`, `"x = 5"` o `{name, value, type, addr, size, blank}`.'
    steps: 'La pila en varios momentos: cada paso con `label` y `frames` (hasta 8 pasos).'
    pointers: 'Flechas entre variables, como `"1.p -> 0.x"`: el marco por su índice desde `main` o por el nombre de la función.'
    showAddresses: Muestra la dirección de cada variable.
    baseAddr: Dirección de la primera variable de `main` (por omisión `0x7FFC`); las siguientes bajan.
    typeSize: Tamaño de una variable que no es puntero (por omisión 4); los punteros ocupan 8.
    showTypes: Muestra el tipo de cada variable.
    blankValues: Deja los valores en blanco.
    blankAddrs: Deja las direcciones en blanco.
  notas:
    - Hasta 10 marcos.
    - El árbol de las llamadas recursivas es [`call_tree`](call_tree.md).

call_tree:
  nombre: Árbol de llamadas
  para: Las llamadas de una función recursiva, su orden, sus resultados y el costo por nivel.
  resumen: |
    Dibuja el árbol de llamadas de una función recursiva con lo que devuelve cada una. Sirve para
    seguir la ejecución (`showOrder` numera el orden), para mostrar subproblemas repetidos
    (`highlight`) y para resolver una recurrencia sumando el costo de cada nivel.
  campos:
    root: 'La llamada inicial: `call`, `returns`, `children` (las llamadas que hace) y `blank`. Hasta 40 llamadas.'
    showOrder: Numera las llamadas en el orden en que se hacen.
    highlight: Llamadas resaltadas, por su texto (por ejemplo `["fib(1)"]`).
    levelCosts: El costo de cada nivel, al costado.
    total: El costo total, debajo.
    blankReturns: Deja en blanco lo que devuelve cada llamada.
    blankCalls: Deja en blanco las llamadas.
    blankLevelCosts: Deja en blanco los costos por nivel.
    blankTotal: Deja en blanco el total.

struct:
  nombre: Struct
  para: La disposición de un struct en memoria (offsets, relleno, sizeof), las uniones con su discriminante y los tipos opacos.
  resumen: |
    Con la variante `layout` (por omisión) dibuja los campos de un struct como los ubica gcc en 64
    bits: offset, tamaño y relleno de cada uno, y el `sizeof` total. Con `opaque` muestra qué ve
    cada archivo de un tipo opaco: el `.h` con el `typedef` y las operaciones, el cliente con un
    puntero y el `.c` con los campos. Con `union`, los miembros superpuestos desde el offset 0.
  calcula:
    - 'El offset, el relleno y el `sizeof` con los tamaños y alineaciones de gcc en 64 bits (`char` 1, `short` 2, `int` y `float` 4, `long`, `double`, `size_t` y punteros 8, y los `intN_t`).'
  variantes:
    layout: Por omisión. La disposición en memoria.
    opaque: Lo que ve cada archivo de un tipo opaco.
    union: 'Una `union`: cada miembro como una barra desde el offset 0, sobre el lugar que ocupa la union (el mayor de los miembros, redondeado a la alineación más exigente, con el relleno final). Con `tag`, el registro exterior con el discriminante; con `active`, el miembro que elige el ejemplo, con su valor.'
  campos:
    fields: 'Los campos: `"char nombre[8]"`, `"int edad = 30"` o `{name, type, value, size, align, blank}` (hasta 16). `size` y `align` sirven para un tipo que dibu no conoce, como un struct anidado.'
    name: Nombre del struct (`struct persona`).
    typedef: Nombre del `typedef`.
    variant: Variante, ver arriba.
    packed: Sin relleno, como `__attribute__((packed))`.
    showAddresses: Muestra la dirección de cada campo.
    baseAddr: Dirección del comienzo del struct.
    variable: El nombre de la variable de ese tipo.
    blankValues: Deja los valores en blanco.
    blankOffsets: Deja los offsets en blanco.
    blankSizes: Deja los tamaños en blanco.
    blankPadding: Saca las filas de relleno, para deducirlas de los offsets.
    blankSizeof: Deja el `sizeof` en blanco.
    operations: En `opaque`, las operaciones del `.h`.
    header: En `opaque`, el nombre del `.h`.
    source: En `opaque`, el nombre del `.c`.
    client: En `opaque`, el código del cliente.
    hidden: En `opaque`, oculta los campos (lo que ve el cliente); no hace falta `fields`.
    active: En `union`, el miembro activo.
    tag: 'En `union`, el discriminante del registro exterior: `{outer, name, type, value}`.'
    compareStruct: En `union`, compara con el `sizeof` de una struct con los mismos campos.
    blankLayout: En `union`, deja en blanco los tamaños, los offsets y el `sizeof`.
    blankTag: En `union`, deja en blanco el valor del discriminante y qué miembro está activo.

byte_layout:
  nombre: Disposición de octetos
  para: Los campos de un formato binario con su ancho, offset y orden de bytes, y las filas de píxeles de un BMP con su stride y su relleno.
  resumen: |
    Dibuja un búfer octeto por octeto. Con la variante `fields` (por omisión), los campos de una
    cabecera o una trama: cada uno con su offset, su ancho y sus bytes, que dibu calcula a partir
    del valor y del orden de bytes, el relleno entre campos y, con `length`, lo que falta de una
    entrada corta. Con `bmp_rows`, las filas de píxeles de un BMP: el stride, los bytes de datos y
    de relleno de cada fila, el offset en el archivo y a qué fila visual corresponde.
  calcula:
    - 'Los bytes de cada campo a partir de `value` y `endian`: `0x1234` es `12 34` en orden de red y `34 12` en little-endian. Un valor que no entra en `size` bytes es un error, sin dibujar un rango imposible.'
    - 'El offset de cada campo y el relleno que deja un `offset` explícito.'
    - 'En `bmp_rows`, el stride (`((ancho × bpp + 31) / 32) × 4`), el relleno de cada fila y el offset de cada una según el orden de filas; los píxeles de 24 bits se escriben en el orden del archivo (B G R: un rojo es `00 00 FF`).'
  variantes:
    fields: Por omisión. Los campos de un formato binario, con una tabla de offset, campo, tamaño y valor.
    bmp_rows: Las filas de píxeles de un BMP de 24 u 8 bits.
  campos:
    fields: 'Los campos, en orden: `{name, size, value, endian}` (de 1 a 8 bytes; `value` en decimal o `"0x1234"`, negativo en complemento a dos), `{name, bytes}` (los octetos tal cual) o `{padding: n}`. `offset` ubica un campo más adelante, con relleno en el medio; `blank: true` deja sus bytes en blanco. Hasta 12 campos y 32 bytes.'
    endian: '`little` (por omisión) o `big` (orden de red), para todos los campos; cada campo puede llevar el suyo.'
    length: Los bytes que llegaron, si son menos que los de los campos; el resto se dibuja como truncado.
    variant: Variante, ver arriba.
    width: En `bmp_rows`, el ancho en píxeles (de 1 a 8).
    height: En `bmp_rows`, el alto en píxeles (de 1 a 6).
    bitsPerPixel: En `bmp_rows`, 24 (por omisión) u 8 (indexado, con paleta).
    offset: En `bmp_rows`, el offset de los píxeles en el archivo (por omisión 54).
    order: 'En `bmp_rows`, `bottom_up` (por omisión: la primera fila del archivo es la de abajo) o `top_down`.'
    pixels: 'En `bmp_rows`, las filas visuales, la de arriba primero: en 24 bits, colores `"RRGGBB"` o `[r, g, b]`; en 8 bits, índices de la paleta. Sin `pixels`, los datos quedan para completar.'
    paletteSize: En `bmp_rows` de 8 bits, la cantidad de colores; un índice fuera de la paleta se tacha (el relleno no se valida).
    available: En `bmp_rows`, los bytes de filas que hay; el resto se dibuja como truncado.
    blank: 'Lo que se deja en blanco: en `fields`, `fields` (los nombres), `offsets`, `bytes` y `values`; en `bmp_rows`, `stride`, `offsets`, `bytes` y `padding`.'
  notas:
    - 'Las clases de octeto se distinguen también en monocromo: el dato con borde lleno, el relleno rayado y el truncado punteado, cada uno con su rótulo.'
    - 'El tamaño de un archivo y el layout en memoria de un `struct` son cosas distintas: para el segundo, ver [`struct`](struct.md).'

object_heap:
  nombre: Stack y heap (objetos)
  para: Variables, objetos y referencias en el stack y el heap, como en Java, Python o C, también en varios instantes.
  resumen: |
    Dibuja los marcos activos en el stack (del tope, arriba, a `main`) y los objetos en el heap,
    con una flecha por cada referencia. Cada objeto tiene un ID: dos referencias al mismo ID llegan
    a la misma caja, y dos objetos con el mismo contenido son cajas distintas. Las referencias
    entre objetos (y a sí mismos) rodean el heap por la derecha. Con `snapshots`, el estado en
    varios instantes, para mostrar copia, mutación y reasignación de referencias: un ID que sigue
    en el instante siguiente queda en el mismo lugar, así se ve cuál flecha cambió. En C, los
    punteros llegan también a variables, campos y celdas, y un bloque liberado queda visible con
    la vida terminada.
  calcula:
    - Qué objetos son alcanzables desde el stack, siguiendo las referencias; los demás se marcan como inalcanzables (en C, como fugas).
    - 'En C, qué punteros quedan colgantes: los que apuntan a un objeto con la vida terminada.'
  campos:
    frames: 'Los marcos, de `main` al tope. Cada uno con `function` y `params` y `vars`: listas de `{name, type, value}` o `{name, type, ref}` (`ref: null` es una referencia nula), o `{x: 3}` para valores.'
    objects: 'Los objetos del heap. Cada uno con `id`, `type` y uno de `fields` (como las variables), `elements` (las celdas de un arreglo: valores sueltos, `{value}` o `{ref}`) o `value` (el contenido, como un `String`). `group` los agrupa, como el String Pool.'
    snapshots: 'Varios instantes (hasta 6), cada uno con `label`, `frames` y `objects`. Un mismo ID en dos instantes es el mismo objeto.'
    direction: Con `snapshots`, `column` (por omisión) los apila y `row` los pone lado a lado.
    variant: "`java` (por omisión), `python` o `c`. En Python, los nombres se agrupan por ámbito (`<módulo>`, las funciones activas), una referencia nula es `None` (un valor rotulado, no una flecha sin destino) y los valores se escriben como en Python (`'texto'`, `True`). En C, ver abajo."
    zones: Los títulos del stack y del heap (`{stack, heap}`); `false` quita los recuadros.
    markUnreachable: Marca los objetos inalcanzables desde el stack (por omisión, sí).
    blankValues: Deja los valores en blanco.
    blankRefs: Deja las referencias en blanco, sin flechas, para dibujarlas.
    blankStates: 'En C, oculta los estados: sin «vida terminada», «fuga» ni «colgante», y sin guiones en las flechas; cada objeto fuera del stack lleva un renglón «estado:» para completar. Un bloque terminado igual se dibuja sin valores; para que eso no lo delate, combinar con `blankValues`.'
  ejercicio: |
    Con `blankRefs`, las cajas de las referencias quedan vacías y sin flechas, para que se dibujen;
    con `blankValues`, los valores. Cada variable, campo o celda acepta además `blank: true`. En
    C, `blankStates` oculta por separado los estados (vida terminada, fuga, colgante), con la misma
    geometría que la versión resuelta.
  notas:
    - 'En C: Una variable con `id` es un destino: `{name: pp, type: "int **", ref: q}` apunta a la variable `q` del llamador, para un parámetro `T **`.'
    - 'En C: Un destino puede ser un objeto (`B`), un campo (`B.sig`) o una celda (`A[2]`); `A[n]`, con `n` celdas, es el límite excluido, que se marca en el borde sin una celda.'
    - 'En C: `storage` dice dónde vive un objeto: `heap` (por omisión), `static` (en un recuadro «estático») o `auto`, con `frame` (la función o su índice, 0 es `main`): un local agregado, como un `struct` o un arreglo, dentro de su marco.'
    - 'En C: `ended: true` es un objeto con la vida terminada (un bloque liberado, un local de una función que retornó): queda visible, con el rótulo «vida terminada» y sin valores legibles. Los punteros que llegan a él son colgantes: con guiones y rotulados. Un `auto` de un marco que no está en `frames` va en un marco «(terminó)» y tiene que llevar `ended`.'
    - 'En C: `indeterminate: true` en una variable es un valor indeterminado (sin inicializar); `ref: null` es `NULL`.'
    - 'En C: `address` es una dirección simbólica. Dos objetos vivos no comparten una dirección, pero uno terminado y el que reutiliza su dirección sí: siguen siendo dos objetos, cada uno con su ID.'
    - Hasta 8 marcos, 16 objetos y 12 variables, campos o celdas por marco u objeto.
    - Una referencia a un ID que no está en `objects`, un ID repetido o `value` junto con `ref` son errores.
    - 'Para la pila de llamadas de C, con direcciones, ver [`call_stack`](call_stack.md); para la matriz de Java, [`matrix`](../lineales/matrix.md) con `variant: java`.'

adt:
  nombre: Tipo abstracto de datos
  para: Un TAD con sus operaciones, precondiciones, invariante y representaciones posibles.
  resumen: |
    Dibuja un tipo abstracto de datos: el cliente, la tabla de operaciones con su clase
    (constructor, modificador, observador…), su precondición y su poscondición, el invariante y
    las representaciones posibles con sus campos.
  campos:
    name: Nombre del TAD.
    operations: 'Las operaciones: texto (la firma) o `{signature, kind, pre, post, blank}`.'
    invariant: El invariante de la representación.
    representations: 'Las representaciones posibles, cada una `{name, fields}`.'
    client: Código cliente que usa el TAD.
    blankOperations: Deja las operaciones en blanco.
    blankKinds: Deja en blanco la clase de cada operación.

tree:
  nombre: Árbol binario
  para: Árboles binarios, de búsqueda, AVL y montículos, por niveles, por inserciones o anidados.
  resumen: |
    Dibuja un árbol binario. Los nodos se dan por niveles (`values`), por una secuencia de
    inserciones en un árbol de búsqueda (`insert`, que en la variante `avl` rebalancea) o como una
    estructura anidada (`root`). El AVL muestra el factor de balance y el montículo, el índice de
    cada nodo y el arreglo debajo.
  variantes:
    binary: Por omisión. Un árbol binario cualquiera.
    bst: Un árbol binario de búsqueda.
    avl: Un AVL, con el factor de balance de cada nodo.
    heap: Un montículo, con el arreglo que lo representa.
  campos:
    values: 'Los nodos por niveles; `""` es una posición sin nodo.'
    insert: Inserciones en un árbol de búsqueda, en orden; con `avl`, rebalancea.
    root: 'Un árbol anidado: `value`, `left`, `right`.'
    variant: Variante, ver arriba.
    nodeStyle: '`struct` dibuja cada nodo como un struct con `*izq` y `*der`.'
    nullLeaves: Dibuja los punteros a NULL de las hojas.
    highlight: Nodos resaltados, por su valor.
    showBalance: En el AVL, el factor de balance de cada nodo.
    showArray: En el montículo, el arreglo debajo.
    blankValues: Deja los valores en blanco.
    blankBalance: Deja en blanco los factores de balance.
  notas:
    - Para seguir las rotaciones de un AVL paso a paso, ver [`avl`](avl.md); para las operaciones de un montículo, [`heap`](heap.md).

heap:
  nombre: Montículo (heap)
  para: Min-heaps y max-heaps construidos por inserciones o con heapify, con sus operaciones.
  resumen: |
    Dibuja un montículo binario como árbol y como arreglo, con el índice de cada posición. Se
    construye insertando los valores de a uno (con *sift-up*), con el algoritmo de Floyd
    (*heapify*) o tal como se da, y después aplica las operaciones de `ops`. Con `steps` muestra
    el estado después de cada paso.
  calcula:
    - La reubicación de cada inserción (flotar) y de cada extracción (hundir).
    - El heapify de Floyd, desde la mitad del arreglo hacia la raíz.
  campos:
    values: Los valores iniciales.
    kind: '`min` (la raíz es el menor) o `max`.'
    build: '`insert` (de a uno), `heapify` (Floyd) o `none` (el arreglo tal como está).'
    ops: 'Operaciones a aplicar después: `"insert 12"` y `"extract"`.'
    steps: Dibuja el estado después de cada inserción y de cada operación (hasta 16).
    blank: Deja en blanco el estado final (árbol y arreglo), para completar.

avl:
  nombre: Árbol AVL
  para: Inserciones y eliminaciones en un AVL, con las rotaciones que hace cada una.
  resumen: |
    Inserta las claves en un AVL vacío, de a una, y elimina las de `delete`. Dibuja el árbol
    final con el factor de balance de cada nodo y, con `steps`, el árbol después de cada operación
    con el nombre de la rotación que la rebalanceó.
  calcula:
    - Las rotaciones simples y dobles (izquierda-derecha, derecha-izquierda) de cada operación.
    - El factor de balance (altura izquierda menos altura derecha) de cada nodo.
  campos:
    keys: Las claves a insertar, en orden (hasta 40). Las repetidas se ignoran.
    delete: Claves a eliminar después de las inserciones.
    steps: '`none` (sólo el final), `rotations` (los pasos que rotan) o `all` (todos).'
    balance: Muestra el factor de balance de cada nodo (por omisión, sí).
    blank: Deja en blanco el árbol final, para completar.

bplus_tree:
  nombre: Árbol B+
  para: Inserciones en un árbol B+, con las divisiones de hojas y nodos internos.
  resumen: |
    Inserta las claves en un árbol B+ y dibuja sus niveles: los nodos internos con las claves
    separadoras y las hojas, con todas las claves y enlazadas entre sí. Con `steps`, muestra el
    árbol después de cada inserción que divide un nodo.
  calcula:
    - La división de una hoja (sube una copia de la primera clave de la derecha) y la de un nodo interno (sube la clave del medio).
  campos:
    keys: Las claves a insertar, en orden (hasta 60).
    order: Orden del árbol, la cantidad máxima de hijos (por omisión 4).
    maxKeys: Claves máximas por nodo, si no es `order − 1`.
    steps: Dibuja el árbol después de cada inserción que divide un nodo (hasta 12).
    blank: Deja en blanco las claves del árbol final.

hash_table:
  nombre: Tabla de hash
  para: Inserciones en una tabla de hash, con encadenamiento o direccionamiento abierto.
  resumen: |
    Inserta las claves en una tabla de `size` cubetas con h(k) = k mod m y dibuja la tabla
    resultante junto al registro de cada inserción: su hash, la secuencia de sondeos y la
    posición final. Las colisiones se resuelven por encadenamiento o con sondeo lineal,
    cuadrático o doble hashing.
  calcula:
    - El hash de cada clave (los textos, por la suma de sus caracteres o el polinomio de base 31).
    - La secuencia de sondeos y la posición final, o «sin lugar» si la tabla está llena.
    - El factor de carga α y la cantidad de inserciones con colisión.
  campos:
    size: Cantidad de cubetas m (de 1 a 101).
    keys: Las claves, enteros o textos, en el orden en que se insertan.
    collision: '`chaining`, `linear`, `quadratic` o `double`.'
    R: En doble hashing, el R de h₂(k) = R − (k mod R); por omisión, el primo menor que m.
    stringHash: 'Hash de los textos: `sum` (suma de códigos) o `poly` (base 31).'
    blank: Deja en blanco la tabla y el registro, para completar.

complexity:
  nombre: Complejidad
  para: Curvas de crecimiento para comparar órdenes, y jerarquías de clases de complejidad.
  resumen: |
    Con la variante `growth` (por omisión) dibuja curvas de crecimiento para comparar órdenes;
    con `blankLabels` salen rotuladas A, B, C… para asociarlas con su clase. Una curva con
    `points` son mediciones, para clasificarlas. Con `classes`, dibuja conjuntos anidados de
    clases de complejidad.
  variantes:
    growth: Por omisión. Curvas de crecimiento.
    classes: Conjuntos anidados de clases.
  campos:
    curves: 'Las curvas: `1`, `log n`, `sqrt n`, `n`, `n log n`, `n^2`, `n^3`, `2^n`, `n!` (también como `O(n²)`), o `{label, points}` para mediciones.'
    variant: Variante, ver arriba.
    maxN: El n máximo del eje horizontal.
    maxY: El máximo del eje vertical; las curvas que se salen se cortan.
    xLabel: Rótulo del eje horizontal.
    yLabel: Rótulo del eje vertical.
    blankLabels: Rotula las curvas A, B, C… en el orden de `curves`.
    classes: 'En `classes`, la jerarquía, de la más chica a la más grande (por omisión los órdenes comunes; también `[P, NP, EXPTIME]`).'
    items: 'En `classes`, ejemplos dentro de cada clase: `{"O(n)": [búsqueda lineal]}`.'
    blankClasses: Deja en blanco los nombres de las clases.

flowchart:
  nombre: Diagrama de flujo
  para: Diagramas de flujo armados a partir de la estructura del algoritmo.
  resumen: |
    Arma el diagrama de flujo a partir de la estructura del algoritmo: pasos, entradas y salidas,
    condicionales y ciclos anidados. Cada paso con `blank: true` sale vacío para completar.

    Los saltos van a su destino por un carril a la derecha: `break` a la salida del lazo más
    interno, `continue` a su condición y `return` al fin; después de un salto no hay arista hacia
    el paso siguiente. Un `try` dibuja su región, los `except` a la derecha (a los que se llega con
    flechas con guiones, las excepcionales), el `else` en el camino sin excepción y el `finally`,
    al que llegan todos los caminos; con `propagate: true`, una excepción no capturada pasa por
    el `finally` y se propaga.
  campos:
    steps: 'Los pasos: un texto, `{io}` (entrada o salida), `{step}`, `{if, then, else}`, `{while, do}`, `{for, do}`, `{doWhile, do}` (el cuerpo antes de la condición), `{break: true}`, `{continue: true}`, `{return: expresión}` o `{try, except, else, finally, propagate}`; cada uno con `blank`.'
    start: Rótulo del inicio (por omisión `Inicio`); `false` lo quita.
    end: Rótulo del fin (por omisión `Fin`); `false` lo quita.
    blankValues: Deja en blanco el texto de todos los pasos.
  notas:
    - "`break` y `continue` fuera de un lazo, y `return` sin el fin del diagrama (`end: false`), son errores."
    - "`try`: `except` es una lista de `{matches, do}` (`matches` es un tipo, una lista de tipos o nada); `else` necesita algún `except`, y un `try` necesita `except` o `finally`."
    - Por ahora, un salto dentro de un `try` o un `try` dentro de otro no se dibujan.

cost_table:
  nombre: Tabla de costos
  para: El análisis de un algoritmo línea por línea, con el costo y las veces de cada una.
  resumen: |
    Dibuja el análisis línea por línea de un algoritmo: el código (con su sangría), el costo de
    cada línea y cuántas veces se ejecuta, y el total.
  campos:
    lines: 'Las líneas: `[código, costo, veces]` o `{code, cost, times}`.'
    total: El costo total, debajo.
    blankCosts: Deja los costos en blanco.
    blankTimes: Deja en blanco las veces.
    blankTotal: Deja el total en blanco.

trace_table:
  nombre: Tabla de traza
  para: Pruebas de escritorio de variables y trazas de operaciones sobre una estructura.
  resumen: |
    Dibuja una prueba de escritorio: columnas con las variables y una fila por paso. Las filas
    que faltan hasta `rowCount` y los `null` quedan para completar. También dibuja las tablas de
    traza de statics, con una secuencia de operaciones sobre una estructura de capacidad fija.
  variantes:
    stack: Sólo cambia los rótulos por omisión, para trazas de una pila.
    program: "La prueba de escritorio de un programa: cada fila es `{step, stage, input, check, values, output, blanks}` y la tabla suma las columnas de etapa, paso, entrada, condición y salida que se usen. Una cadena vacía se ve como `''`, sin entrada o sin emisión como `—`, y `null` es un casillero para completar."
  campos:
    columns: Las columnas (las variables).
    rows: 'Las filas; `null` o una fila corta quedan para completar.'
    rowCount: Cantidad total de filas; las que faltan quedan vacías.
    operations: Las operaciones de cada fila, en la primera columna (o la traza de statics).
    operationHeader: Encabezado de la columna de operaciones.
    capacity: En la traza de statics, la capacidad de la estructura.
    pointerHeader: En la traza de statics, el encabezado de la columna del puntero.
    pointerLabel: En la traza de statics, el nombre del puntero.
    variant: Variante, ver arriba.
    blankValues: Deja los valores en blanco (en `program`, también la condición y la salida).
    condition: En `program`, el encabezado de la columna de la condición (por ejemplo `x != 0`).
    stepHeader: En `program`, el encabezado de la columna de pasos (por omisión `Paso`).
    inputHeader: En `program`, el encabezado de la entrada (por omisión `Entrada`).
    outputHeader: En `program`, el encabezado de la salida (por omisión `Salida`).
  ejercicio: |
    En `program`, `blanks` en una fila oculta esas celdas (`[output]`, `[check]`, o el nombre de
    una variable): la respuesta no queda en el SVG.
  notas:
    - "En `program`, `stage` puede ser `initial` (estado inicial), `iteration` (iteración), `output` (salida) u otro texto; se escribe en la primera fila de cada tramo. Una fila sin `values` no muestra las variables."
    - En `program` también valen las filas posicionales (una lista de valores).

dp_table:
  nombre: Tabla de programación dinámica
  para: LCS, distancia de edición, mochila 0/1 y cambio de monedas, con el camino de reconstrucción.
  resumen: |
    Llena la tabla de programación dinámica del problema elegido y resalta el camino de
    reconstrucción de la solución. Debajo escribe el resultado: la subsecuencia, las operaciones
    de edición, los objetos elegidos o las monedas.
  calcula:
    - '`lcs`: la longitud y una subsecuencia común más larga.'
    - '`edit`: la distancia de Levenshtein y las operaciones (sustituir, insertar, borrar).'
    - '`knapsack`: el valor máximo y los objetos elegidos.'
    - '`coins`: la mínima cantidad de monedas y cuáles.'
  campos:
    problem: '`lcs`, `edit`, `knapsack` o `coins`.'
    a: En `lcs` y `edit`, el primer texto (hasta 24 caracteres).
    b: En `lcs` y `edit`, el segundo texto.
    weights: En `knapsack`, los pesos (de 1 a 15 objetos).
    values: En `knapsack`, los valores.
    capacity: En `knapsack`, la capacidad de la mochila (de 1 a 40).
    coins: En `coins`, los valores de las monedas.
    amount: En `coins`, el monto a formar (de 1 a 60).
    path: Resalta el camino de reconstrucción (por omisión, sí).
    blank: Deja la tabla en blanco (salvo la primera fila y columna) y el resultado.

dijkstra:
  nombre: Dijkstra
  para: La tabla de iteraciones del algoritmo de Dijkstra y los caminos mínimos.
  resumen: |
    Ejecuta Dijkstra desde `source` y dibuja la tabla de iteraciones: en cada paso, el vértice
    que se visita y la distancia y el predecesor de cada vértice (✓ si ya fue visitado). Debajo,
    la distancia y el camino mínimo a cada destino.
  calcula:
    - Las distancias y predecesores de cada iteración; los empates se rompen por el orden de los vértices.
  campos:
    edges: 'Las aristas: `"A-B:4"` (no dirigida), `"A->B:4"` (dirigida) o `{from, to, w}`.'
    source: El vértice de origen (por omisión, el primero).
    vertices: El orden de los vértices, si no sale de las aristas.
    directed: Toma como dirigidas las aristas escritas con `-`.
    paths: Agrega la tabla de caminos mínimos (por omisión, sí).
    blank: Deja en blanco las iteraciones y los caminos.
  notas:
    - Con pesos negativos es un error, porque Dijkstra no los admite.
    - El grafo en sí no se dibuja; para eso alcanza con Mermaid o Graphviz.

turing:
  nombre: Máquina de Turing
  para: La traza de configuraciones de una máquina de Turing y su tabla de transiciones.
  resumen: |
    Simula una máquina de Turing de una cinta sobre la entrada y dibuja cada configuración: el
    paso, el estado y la cinta con el cabezal resaltado. Debajo, si acepta, rechaza o no se
    detuvo, y la tabla de transiciones δ.
  campos:
    transitions: 'Las transiciones: `"q0,1 -> q1,X,R"` (estado, símbolo leído, estado nuevo, símbolo escrito, movimiento `R`, `L` o `S`), o un mapa `"q0,1": "q1,X,R"`.'
    input: La entrada (hasta 40 símbolos).
    start: El estado inicial (por omisión `q0`).
    accept: Los estados de aceptación.
    blankSymbol: El símbolo blanco (por omisión `_`).
    maxSteps: Pasos máximos de la simulación (de 1 a 200, por omisión 40).
    table: Agrega la tabla de transiciones (por omisión, sí).
    blank: Dibuja sólo la configuración inicial, para completar la traza.

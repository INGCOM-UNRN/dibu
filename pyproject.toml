[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dibu"
version = "0.1.0"
description = "Generador rápido de diagramas SVG educativos en Rust (CS, control de procesos y química)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Martín René Vilugrón", email = "martinvilu@gmail.com" }]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/INGCOM-UNRN/dibu"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/dibu-cli/Cargo.toml"
strip = true

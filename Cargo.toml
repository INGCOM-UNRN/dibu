[workspace]
resolver = "2"
members = [
    "crates/dibu-core",
    "crates/dibu-plot",
    "crates/dibu-control",
    "crates/dibu-chem",
    "crates/dibu-cs",
    "crates/dibu-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Martín René Vilugrón <martinvilu@gmail.com>"]
repository = "https://github.com/INGCOM-UNRN/dibu"

[workspace.dependencies]
dibu-core = { path = "crates/dibu-core" }
dibu-plot = { path = "crates/dibu-plot" }
dibu-control = { path = "crates/dibu-control" }
dibu-chem = { path = "crates/dibu-chem" }
dibu-cs = { path = "crates/dibu-cs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }
regex = "1"
thiserror = "2"
num-complex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

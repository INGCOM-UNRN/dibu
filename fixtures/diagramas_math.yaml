# Diagramas de matemática aplicada (dibu-math).

# === J. SEÑALES Y SISTEMAS ===
- type: signal
  id: senal-continua
  title: Operaciones sobre señales continuas
  signals:
    - { expr: "rect((t-1)/2)", label: "x(t)" }
    - { expr: "rect((2t-1)/2)", label: "x(2t)" }
  range: [-1, 4]

- type: signal
  id: senal-discreta
  title: Señal discreta exponencial
  domain: discrete
  expr: "0.8^n u(n)"
  label: "x[n]"
  range: [-4, 12]

- type: convolution
  id: convolucion
  title: Convolución discreta paso a paso
  x: [1, 2, 1]
  h: [1, 1, 1, 1]
  step: 2

- type: fourier
  id: serie-fourier
  title: Serie de Fourier de una onda cuadrada
  wave: square
  harmonics: 9

- type: fourier
  id: dft
  title: DFT de 8 puntos
  sequence: [1, 1, 1, 1, 0, 0, 0, 0]

- type: sampling
  id: muestreo-alias
  title: Muestreo con aliasing
  frequency: 9
  fs: 12
  periods: 3

- type: sampling
  id: muestreo-ok
  title: Muestreo que cumple Nyquist
  frequency: 2
  fs: 10
  periods: 2
  spectrum: true

# === K. PROBABILIDAD ===
- type: distribution
  id: normal
  title: Distribución normal estándar
  dist: normal
  mean: 0
  sd: 1
  interval: [-1.96, 1.96]

- type: distribution
  id: binomial
  title: Distribución binomial
  dist: binomial
  n: 10
  p: 0.3
  interval: [2, 4]

- type: distribution
  id: t-student
  title: "Ejercicio: cola derecha de una t"
  dist: t
  df: 8
  interval: [2.306, null]
  blank: true

- type: venn
  id: venn-operaciones
  title: Operaciones con conjuntos
  sets: [A, B, C]
  shade: ["A ∩ B", "(A ∪ B) − C", "A Δ B", "C'"]

- type: venn
  id: venn-elementos
  title: Elementos por región
  sets: [A, B]
  shade: "A − B"
  regions:
    A: [1, 3, 5]
    "A,B": [7, 9]
    B: [2, 4]
    U: [6, 8]

# === L. CIRCUITOS ELÉCTRICOS ===
- type: circuit
  id: circuito-mixto
  title: Circuito serie-paralelo
  source: "V1 = 12V"
  network:
    series:
      - "R1 = 100Ω"
      - parallel: ["R2 = 220Ω", "R3 = 330Ω"]
      - "R4 = 47Ω"

- type: circuit
  id: circuito-rlc
  title: RLC en alterna
  frequency: 50
  source: "V = 220"
  network:
    series:
      - "R = 10Ω"
      - "L = 100mH"
      - parallel: ["C = 100uF", "R2 = 50Ω"]

- type: phasor
  id: fasores
  title: Suma de fasores
  phasors:
    - { label: V1, magnitude: 10, angle: 30 }
    - { label: V2, magnitude: 6, angle: -45 }
    - { label: V3, magnitude: 4, angle: 120 }
  sum: true
  unit: V

# Catálogo Kitchen Sink de `dibu` — 71 tipos con variantes (paleta tinta/color, blank*, UTF-8, XML &<>)

# === A. CONTROL DE PROCESOS (9 tipos) ===

- id: ks_control_block_diagram_lazo
  type: block_diagram
  title: "Lazo con perturbación <D(s) & H(s)>"
  input: "R(s)"
  output: "Y(s)"
  error: "E(s)"
  forward:
    - {label: "Gc(s)", out: "U(s)"}
    - {label: "Gv(s)", out: "M(s)"}
    - "Gp(s)"
  disturbance: {at: 2, label: "D(s)", block: "Gd(s)"}
  feedback: ["H(s)"]
  measured: "B(s)"
  inkSaver: true

- id: ks_control_block_diagram_cascada_blank
  type: block_diagram
  title: Control en cascada (evaluación)
  forward:
    - "Gc1(s)"
    - loop:
        forward: ["Gc2(s)", "Gp2(s)"]
        feedback: ["H2(s)"]
    - "Gp1(s)"
  feedback: ["H1(s)"]
  blankSigns: true
  inkSaver: false

- id: ks_control_block_diagram_perturbaciones
  type: block_diagram
  title: Perturbaciones a la entrada de la válvula, a la salida y en el sensor
  input: "R(s)"
  error: "E(s)"
  forward:
    - {label: "Gc(s)", out: "U(s)"}
    - {label: "Gv(s)", out: "M(s)"}
    - "Gp(s)"
  disturbance:
    - {at: 1, label: "D1(s)"}
    - {at: 3, label: "D2(s)", from: bottom, block: "Gd(s)"}
    - {path: feedback, label: "N(s)"}
  feedback: ["H(s)"]
  sign: "-"
  measured: "B(s)"

- id: ks_control_block_diagram_entradas
  type: block_diagram
  title: Dos referencias y una prealimentación antes del comparador
  input: "R1(s)"
  inputs:
    - {label: "R2(s)", sign: "-"}
    - {label: "V(s)", block: "Gff(s)", from: bottom}
  forward: ["Gc(s)", "Gp(s)"]
  feedback: []

- id: ks_control_block_diagram_cascada_perturbaciones_blank
  type: block_diagram
  title: Cascada con perturbaciones en los dos lazos (signos para completar)
  forward:
    - "Gc1(s)"
    - loop:
        forward: ["Gc2(s)", "Gp2(s)"]
        feedback: ["H2(s)"]
        disturbance: [{at: 1}, {at: 1, from: bottom, sign: "-"}]
        blankSigns: true
    - "Gp1(s)"
  disturbance: [{at: 3, label: "D(s)"}, {path: feedback, sign: "-"}]
  feedback: ["H1(s)"]
  blankSigns: true
  inkSaver: false

- id: ks_control_time_response_subamortiguado
  type: time_response
  title: Segundo orden subamortiguado (ζ = 0,3)
  system: {gain: 1, zeta: 0.3, wn: 2}
  annotations: [final, overshoot, peak, rise, settling]

- id: ks_control_time_response_fopdt_blank
  type: time_response
  title: Curva FOPDT con retardo (para completar)
  system: {gain: 2, num: [2], den: [15, 8, 1], delay: 1}
  annotations: [final, tangent]
  blankAnnotations: true
  inkSaver: false

- id: ks_control_time_response_pi_lazo
  type: time_response
  title: Lazo cerrado con PI y perturbación
  closedLoop:
    plant: {gain: 2, tau: 5, delay: 1}
    controller: {kp: 1.2, ki: 0.25}
  disturbance: {at: 30, amplitude: -0.5}
  tEnd: 60
  annotations: [overshoot, settling]

- id: ks_control_bode_margenes
  type: bode
  title: Bode de L(s) = 10 / (s(s+1)(s+10))
  system: {k: 10, poles: [0, -1, -10]}
  asymptotes: true
  margins: true

- id: ks_control_nyquist_circulo
  type: nyquist
  title: Nyquist con círculo unitario
  system: {k: 5, poles: [-1, -2, -3]}
  unitCircle: true
  inkSaver: false

- id: ks_control_pole_zero_completo
  type: pole_zero
  title: Polos y ceros con ζ y ωn
  poles: [-1, [-2, 3]]
  zeros: [-4]
  dampingLines: [0.5]
  wnCircles: [3]
  showValues: true
  inkSaver: false

- id: ks_control_root_locus_marcas
  type: root_locus
  title: Lugar de las raíces K / (s(s+1)(s+2))
  system: {k: 1, poles: [0, -1, -2]}
  marks: [1]

- id: ks_control_instrumentation_pid
  type: instrumentation
  title: Control de nivel TK-101 (ISA-5.1)
  equipment:
    - {id: TK, kind: tank, at: [3, 3], label: "TK-101", level: 0.6}
    - {id: P1, kind: pump, at: [6, 5.2], label: "P-101"}
    - {id: LV, kind: control_valve, at: [8.5, 4.8], label: "LV-101"}
  instruments:
    - {id: LT, tag: "LT 101", at: [5, 2]}
    - {id: LIC, tag: "LIC 101", at: [7, 1], location: dcs}
  lines:
    - {from: [0.5, 1.4], to: TK, label: "entrada", via: [[3, 1.4]]}
    - {from: TK, to: P1, via: [[3, 5.2]]}
    - {from: P1, to: LV, via: [[7, 4.8]]}
    - {from: LV, to: [11, 4.8], label: "salida"}
    - {from: TK, to: LT, kind: capillary, via: [[4, 2]]}
    - {from: LT, to: LIC, kind: electric, via: [[5, 1]]}
    - {from: LIC, to: LV, kind: electric, via: [[8.5, 1]]}
  inkSaver: false

- id: ks_control_instrumentation_blank
  type: instrumentation
  title: Instrumento en blanco
  equipment:
    - {id: TK, kind: tank, at: [2, 2], label: "TK-1"}
  instruments:
    - {id: LT, tag: "LT 1", at: [5, 1], blank: true}
  lines:
    - {from: TK, to: LT, kind: capillary}

- id: ks_control_ladder_enclavamiento
  type: ladder
  title: Arranque y parada con enclavamiento
  rungs:
    - comment: "Motor con enclavamiento"
      logic:
        - or:
            - [{"no": "I0.0", label: "Marcha"}]
            - [{"no": "Q0.0"}]
        - {nc: "I0.1", label: "Parada"}
        - {nc: "I0.2", label: "Térmico"}
        - {coil: "Q0.0", label: "Motor"}
    - comment: "Temporizador de llenado"
      logic:
        - {"no": "Q0.0"}
        - {ton: "T1", preset: "10 s"}
    - logic:
        - {"no": "T1"}
        - {set: "Q0.1", label: "Alarma"}
  inkSaver: true

- id: ks_control_grafcet_and
  type: grafcet
  title: Llenado y mezcla en paralelo
  steps:
    - {step: 0, initial: true}
    - {transition: "Marcha · nivel bajo"}
    - {step: 1, actions: ["Abrir V1"]}
    - {transition: "nivel alto"}
    - and:
        - [{step: 2, actions: ["Agitador"]}, {transition: "t/X2/30 s"}, {step: 4}]
        - [{step: 3, actions: ["Calentar"]}, {transition: "T > 60 °C"}, {step: 5}]
    - {transition: "1"}
    - {step: 6, actions: ["Abrir V2"]}
    - {transition: "nivel bajo"}

- id: ks_control_grafcet_or_blank
  type: grafcet
  title: Divergencia OR con campos en blanco
  steps:
    - {step: 0, initial: true}
    - {transition: "Auto & <Listo>", blank: true}
    - or:
        - [{step: 1, actions: ["Ciclo A"], blank: true}]
        - [{step: 2, actions: ["Ciclo B"]}]
    - {transition: "Fin"}
  inkSaver: false


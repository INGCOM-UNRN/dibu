- id: ks_cs_stack_vertical_multi
  type: stack
  title: Pila con traza vertical
  layout: vertical_multi
  values: [1]
  traceLabels: ["Inicio", "push(2)", "pop()"]

- id: ks_cs_call_stack_marcos
  type: call_stack
  title: Marcos de activación con punteros
  showAddresses: true
  showTypes: true
  frames:
    - function: main
      vars:
        - {name: a, value: 3, type: int}
        - {name: b, value: 7, type: int}
    - function: intercambiar
      returnTo: main
      params:
        - {name: x, value: "&a", type: "int *"}
        - {name: y, value: "&b", type: "int *"}
      vars: ["aux = 3"]
  pointers: "1.x -> 0.a; intercambiar.y -> main.b"

- id: ks_cs_call_stack_steps_blank
  type: call_stack
  title: Pila de llamadas por pasos
  blankValues: true
  steps:
    - label: "llama a fact(2)"
      frames:
        - {function: main, vars: {r: "?"}}
        - {function: fact, params: {n: 2}}
    - label: "fact(1) devuelve 1"
      frames:
        - {function: main, vars: {r: "?"}}
        - {function: fact, params: {n: 2}}
        - {function: fact, params: {n: 1}, returns: 1, popped: true}
  inkSaver: false

- id: ks_cs_call_tree_fib3_costos
  type: call_tree
  title: Árbol de llamadas fib(3)
  showOrder: true
  levelCosts: ["1", "2", "2"]
  total: "2^n"
  root:
    call: "fib(3)"
    returns: 2
    children:
      - call: "fib(2)"
        returns: 1
        children:
          - {call: "fib(1)", returns: 1}
          - {call: "fib(0)", returns: 0}
      - {call: "fib(1)", returns: 1}

- id: ks_cs_call_tree_blank
  type: call_tree
  title: Árbol de llamadas (retornos en blanco)
  blankReturns: true
  blankLevelCosts: true
  levelCosts: ["n", "2n"]
  total: "n^2"
  root:
    call: "f(2)"
    returns: 2
    children:
      - {call: "f(1)", returns: 1}
      - {call: "f(0)", returns: 0}
  inkSaver: false

- id: ks_cs_queue_circular
  type: queue
  title: Cola circular en arreglo de capacidad 8
  variant: circular
  capacity: 8
  frontIndex: 5
  rearIndex: 1
  inkSaver: false

- id: ks_cs_tree_avl
  type: tree
  title: Árbol AVL rebalanceado
  variant: avl
  insert: [10, 20, 30, 40, 50, 25]

- id: ks_cs_tree_heap_array
  type: tree
  title: Max-Heap con arreglo subyacente
  variant: heap
  values: [90, 70, 80, 30]
  showArray: true
  inkSaver: false

- id: ks_cs_struct_layout
  type: struct
  title: Layout LP64 con padding
  name: struct outer
  fields:
    - {name: c, type: char}
    - {name: pos, type: struct punto, size: 8, align: 4}

- id: ks_cs_struct_opaque
  type: struct
  title: TAD opaco en C
  variant: opaque
  name: struct pila
  typedef: pila_t
  operations: ["void f(pila_t p)"]
  fields: ["int *datos", "size_t tope"]
  hidden: true
  inkSaver: false

- id: ks_cs_adt_pila
  type: adt
  title: Especificación TAD Pila
  name: Pila
  blankKinds: true
  operations:
    - {signature: "f()", kind: observador, pre: "p != NULL"}
    - {signature: "g()", post: "tope' > 0", blank: true}
  client: ["crear();"]
  invariant: "tope >= 0"
  representations:
    - Arreglo
    - {name: Lista, fields: ["nodo_t *cabeza"]}

- id: ks_cs_complexity_growth
  type: complexity
  title: Órdenes de crecimiento Θ(n²)
  curves:
    - "Θ(n²)"
    - "n log n"
    - label: medido
      points: [[2, 5], [10, 90]]

- id: ks_cs_complexity_classes
  type: complexity
  title: Clases de complejidad P vs NP
  variant: classes
  classes: ["P", "NP"]
  items:
    P: ["ordenar"]
  inkSaver: false

- id: ks_cs_flowchart_completo
  type: flowchart
  title: "Bucle con condición < & >"
  steps:
    - {io: "leer n"}
    - "i = 0"
    - while: "i < n && n > 0"
      do:
        - if: "par(i)"
          then: ["s = s + i"]
          else: ["s = s - i"]
        - "i = i + 1"

- id: ks_cs_cost_table_sangria_blank
  type: cost_table
  title: Análisis línea a línea (evaluación)
  lines:
    - ["for (;;)", "c1", "n"]
    - ["    x++;", "c2", "n - 1"]
  total: 2n
  blankCosts: true
  blankTotal: true

- id: ks_cs_trace_table_variables
  type: trace_table
  title: Tabla de seguimiento de variables
  columns: ["i", "suma"]
  rows: [[0, 7], [1, null]]
  rowCount: 4

- id: ks_cs_trace_table_statics_stack
  type: trace_table
  title: Seguimiento de pila (statics)
  variant: stack
  capacity: 5
  pointerLabel: "TOPE: ___"
  operations: ["1. push(10)", "2. pop()"]
  inkSaver: false

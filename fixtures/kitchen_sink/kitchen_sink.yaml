- id: ks_cs_flowchart_break_continue
  type: flowchart
  title: break en el lazo interno y continue en el externo
  steps:
    - for: "i en range(3)"
      do:
        - if: "i == 1"
          then:
            - continue: true
        - for: "j en range(3)"
          do:
            - if: "j == i"
              then:
                - break: true
            - io: "MOSTRAR i, j"
        - "total = total + 1"

- id: ks_cs_flowchart_return_blank
  type: flowchart
  title: "def buscar(xs, x) (para completar)"
  steps:
    - for: "v en xs"
      do:
        - if: "v == x"
          then:
            - {return: "True", blank: true}
    - {return: "False", blank: true}
  inkSaver: false

- id: ks_cs_flowchart_try
  type: flowchart
  title: try / except / else / finally
  steps:
    - {io: "LEER texto"}
    - try:
        - step: "n = int(texto)"
      except:
        - matches: ValueError
          do:
            - io: "MOSTRAR error"
      else:
        - io: "MOSTRAR n"
      finally:
        - step: "Registrar intento"
      propagate: true

- id: ks_cs_flowchart_try_finally_blank
  type: flowchart
  title: try / finally (para completar)
  blankValues: true
  steps:
    - try:
        - step: "f = abrir(ruta)"
        - step: "procesar(f)"
      finally:
        - step: "f.close()"
      propagate: true

- id: ks_cs_trace_table_programa
  type: trace_table
  variant: program
  title: "Suma hasta leer 0"
  condition: "x != 0"
  columns: [x, suma]
  rows:
    - {stage: initial, step: "Primera lectura", input: 4, values: [4, 0]}
    - {stage: iteration, step: "Vuelta 1", check: true, values: [4, 4]}
    - {stage: iteration, step: "Lectura", input: 0, values: [0, 4]}
    - {stage: iteration, step: "Centinela", check: false, values: [0, 4]}
    - {stage: output, step: "Mostrar", output: 4}

- id: ks_cs_trace_table_programa_blank
  type: trace_table
  variant: program
  title: "Cero vueltas (para completar)"
  condition: "x != 0"
  columns: [x, suma]
  rows:
    - {step: "Primera lectura", input: 0, values: [0, 0]}
    - {step: "Condición", check: false, values: [0, null], blanks: [check]}
    - {step: "Mostrar", output: 0, blanks: [output]}
